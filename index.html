<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Scanner Camera Test</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin: 20px 0;
    }

    #video {
      width: 100%;
      max-width: 700px;
      height: auto;
      background: black;
    }

    #status {
      padding: 20px;
      font-size: 20px;
    }

    button {
      font-size: 20px;
      padding: 15px 30px;
      margin: 15px;
    }
  </style>
</head>

<body>

<h2>Stock Scanner Camera Test</h2>

<button id="start">OPEN CAMERA</button>

<video id="video"
       autoplay
       playsinline
       muted>
</video>

<div id="status">
  Camera not started
</div>

<script>

const video =
  document.getElementById("video");

const status =
  document.getElementById("status");

document
  .getElementById("start")
  .addEventListener("click", async function () {

    status.textContent =
      "Requesting camera...";

    try {

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

      video.srcObject = stream;

      status.textContent =
        "CAMERA WORKING ✓";

    } catch (error) {

      console.error(error);

      status.textContent =
        "CAMERA ERROR: " +
        error.name +
        " - " +
        error.message;
    }

  });

</script>

</body>
</html>
