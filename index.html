<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <title>Stock Scanner V2.1</title>

  <!-- QR decoder -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       VERSION BADGE
    ========================= */

    #version {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 9999;

      background: red;
      color: white;

      padding: 6px 10px;

      font-size: 14px;
      font-weight: bold;

      border-radius: 0 0 0 8px;
    }

    /* =========================
       TOP
    ========================= */

    #top {
      background: #111;
      text-align: center;
      padding: 10px;
    }

    #title {
      font-size: 20px;
      font-weight: bold;
    }

    #column {
      margin-top: 5px;
      font-size: 26px;
      font-weight: bold;
    }

    /* =========================
       CAMERA
    ========================= */

    #cameraArea {
      position: relative;

      flex: 1;
      min-height: 0;

      background: #000;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #000;
    }

    #scanBox {
      position: absolute;

      width: 65vw;
      height: 65vw;

      max-width: 330px;
      max-height: 330px;

      border: 3px solid white;
      border-radius: 12px;

      pointer-events: none;
    }

    /* =========================
       BOTTOM
    ========================= */

    #bottom {
      background: #111;

      text-align: center;

      padding: 10px;
    }

    #lastScan {
      font-size: 22px;
      font-weight: bold;
    }

    #lastType {
      margin-top: 4px;
      font-size: 15px;
    }

    #count {
      margin-top: 4px;
      font-size: 13px;
      color: #aaa;
    }

    /* =========================
       START SCREEN
    ========================= */

    #startScreen {
      position: fixed;

      inset: 0;

      z-index: 1000;

      background: #111;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 25px;
    }

    #startButton {
      font-size: 22px;
      font-weight: bold;

      padding: 18px 35px;

      border: none;

      border-radius: 12px;

      background: white;

      color: black;
    }

    #message {
      margin-top: 20px;

      color: #bbb;

      line-height: 1.5;
    }

    .columnColor {
      color: #ffd43b;
    }

    .itemColor {
      color: #55ff77;
    }

    .errorColor {
      color: #ff5555;
    }

  </style>

</head>


<body>


<!-- =========================
     VERSION
========================= -->

<div id="version">
  V2.1
</div>


<div id="app">


  <!-- =========================
       TOP
  ========================= -->

  <div id="top">

    <div id="title">
      STOCK SCANNER
    </div>

    <div id="column">
      COLUMN: NOT SET
    </div>

  </div>


  <!-- =========================
       CAMERA
  ========================= -->

  <div id="cameraArea">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>

    <div id="scanBox"></div>

    <canvas
      id="canvas"
      style="display:none;">
    </canvas>

  </div>


  <!-- =========================
       BOTTOM
  ========================= -->

  <div id="bottom">

    <div id="lastScan">
      READY
    </div>

    <div id="lastType">
      Scan Column QR
    </div>

    <div id="count">
      Scans: 0
    </div>

  </div>


</div>


<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen">

  <button id="startButton">
    START SCANNER
  </button>

  <div id="message">

    <b>STOCK SCANNER V2.1</b>

    <br><br>

    Tap once to start the camera.

    <br><br>

    After that, scanning is automatic.

  </div>

</div>


<script>


/* =====================================================
   VERSION
===================================================== */

const VERSION = "V2.1";


/* =====================================================
   GOOGLE APPS SCRIPT BACKEND
===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwSd26j_QkkD0WiEPgDXAFsLuJx6cAWePwZnT_WV9h8525cjibUVHksF5YbP64Dmzd-eA/exec";


/* =====================================================
   CAMERA ELEMENTS
===================================================== */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let currentColumn = "";

let scanCount = 0;

let lastValue = "";

let lastScanTime = 0;


/*
 * Prevent the same QR from being
 * scanned repeatedly while it remains
 * in front of the camera.
 */

const DUPLICATE_DELAY = 1200;


/* =====================================================
   BEEP
===================================================== */

function beep(
  frequency = 900,
  duration = 80
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!window.audioContext) {

      window.audioContext =
        new AudioContext();

    }

    const audio =
      window.audioContext;


    if (
      audio.state ===
      "suspended"
    ) {

      audio.resume();

    }


    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();


    oscillator.type =
      "sine";

    oscillator.frequency.value =
      frequency;

    gain.gain.value =
      0.15;


    oscillator.connect(gain);

    gain.connect(
      audio.destination
    );


    oscillator.start();


    oscillator.stop(
      audio.currentTime +
      duration / 1000
    );


  } catch (error) {

    console.log(
      "Beep error:",
      error
    );

  }

}


/* =====================================================
   UPDATE COLUMN DISPLAY
===================================================== */

function updateColumn() {

  const element =
    document.getElementById(
      "column"
    );


  if (currentColumn) {

    element.textContent =
      "COLUMN: " +
      currentColumn;

    element.className =
      "columnColor";

  } else {

    element.textContent =
      "COLUMN: NOT SET";

    element.className = "";

  }

}


/* =====================================================
   UPDATE COUNT
===================================================== */

function updateCount() {

  document.getElementById(
    "count"
  ).textContent =
    "Scans: " +
    scanCount;

}


/* =====================================================
   SEND SCAN TO GOOGLE SHEETS
===================================================== */

function saveScan(
  value,
  type,
  column,
  itemCode
) {


  const params =
    new URLSearchParams();


  params.append(
    "action",
    "scan"
  );


  params.append(
    "value",
    value
  );


  params.append(
    "type",
    type
  );


  params.append(
    "column",
    column || ""
  );


  params.append(
    "itemCode",
    itemCode || ""
  );


  params.append(
    "device",
    navigator.userAgent
  );


  const url =
    APPS_SCRIPT_URL +
    "?" +
    params.toString();


  /*
   * Send to Apps Script.
   *
   * We don't need to read the response.
   */

  fetch(
    url,
    {
      method: "GET",
      mode: "no-cors",
      cache: "no-store"
    }
  )
  .then(
    function() {

      console.log(
        VERSION +
        " scan sent:",
        value
      );

    }
  )
  .catch(
    function(error) {

      console.error(
        "Google Sheet error:",
        error
      );

    }
  );

}


/* =====================================================
   PROCESS QR CODE
===================================================== */

function processQR(
  decodedValue
) {


  const value =
    String(
      decodedValue || ""
    ).trim();


  if (!value) {

    return;

  }


  /* ================================================
     DUPLICATE PROTECTION
  ================================================= */

  const now =
    Date.now();


  if (
    value === lastValue &&
    now - lastScanTime <
      DUPLICATE_DELAY
  ) {

    return;

  }


  lastValue =
    value;

  lastScanTime =
    now;


  /* ================================================
     COLUMN QR
     
     Example:
     
     COLUMN:1
     COLUMN:2
     COLUMN:007
     
     All become:
     
     1
     2
     7
  ================================================= */

  const columnMatch =
    value.match(
      /^COLUMN\s*:\s*(\d+)$/i
    );


  if (columnMatch) {


    currentColumn =
      String(
        Number(
          columnMatch[1]
        )
      );


    scanCount++;


    beep(
      650,
      130
    );


    updateColumn();


    document.getElementById(
      "lastScan"
    ).textContent =
      "COLUMN " +
      currentColumn;


    document.getElementById(
      "lastScan"
    ).className =
      "columnColor";


    document.getElementById(
      "lastType"
    ).textContent =
      "COLUMN CHANGED";


    document.getElementById(
      "lastType"
    ).className =
      "columnColor";


    updateCount();


    saveScan(
      value,
      "COLUMN",
      currentColumn,
      ""
    );


    return;

  }


  /* ================================================
     ITEM QR
  ================================================= */


  if (!currentColumn) {


    beep(
      300,
      250
    );


    document.getElementById(
      "lastScan"
    ).textContent =
      "SCAN COLUMN FIRST";


    document.getElementById(
      "lastScan"
    ).className =
      "errorColor";


    document.getElementById(
      "lastType"
    ).textContent =
      "No active column";


    document.getElementById(
      "lastType"
    ).className =
      "errorColor";


    return;

  }


  /* ================================================
     ITEM ACCEPTED
  ================================================= */


  scanCount++;


  beep(
    1000,
    80
  );


  document.getElementById(
    "lastScan"
  ).textContent =
    value;


  document.getElementById(
    "lastScan"
  ).className =
    "itemColor";


  document.getElementById(
    "lastType"
  ).textContent =
    "ITEM → COLUMN " +
    currentColumn;


  document.getElementById(
    "lastType"
  ).className =
    "itemColor";


  updateCount();


  saveScan(
    value,
    "ITEM",
    currentColumn,
    value
  );

}


/* =====================================================
   CONTINUOUS QR SCANNING
===================================================== */

function scanFrame() {


  /*
   * Camera isn't ready yet.
   */

  if (
    !stream ||
    video.readyState !==
      video.HAVE_ENOUGH_DATA
  ) {

    requestAnimationFrame(
      scanFrame
    );

    return;

  }


  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  if (
    !width ||
    !height
  ) {

    requestAnimationFrame(
      scanFrame
    );

    return;

  }


  /*
   * Draw camera image
   * onto invisible canvas.
   */

  canvas.width =
    width;

  canvas.height =
    height;


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  /*
   * Get pixels.
   */

  const imageData =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  /*
   * Decode QR.
   */

  const qr =
    jsQR(
      imageData.data,
      width,
      height,
      {
        inversionAttempts:
          "attemptBoth"
      }
    );


  if (qr) {

    processQR(
      qr.data
    );

  }


  /*
   * Continue forever.
   */

  requestAnimationFrame(
    scanFrame
  );

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {


  const button =
    document.getElementById(
      "startButton"
    );


  const message =
    document.getElementById(
      "message"
    );


  button.disabled =
    true;


  button.textContent =
    "STARTING V2.1...";


  /*
   * Initialize audio after
   * the user interaction.
   */

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (AudioContext) {

      window.audioContext =
        new AudioContext();


      await window.audioContext
        .resume();

    }

  } catch (error) {

    console.log(
      "Audio unavailable:",
      error
    );

  }


  try {


    /*
     * Native browser camera API.
     *
     * This is deliberately NOT
     * html5-qrcode.
     */

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


    /*
     * Attach camera.
     */

    video.srcObject =
      stream;


    await video.play();


    /*
     * CAMERA SUCCESS
     */

    document.getElementById(
      "startScreen"
    ).style.display =
      "none";


    document.getElementById(
      "lastScan"
    ).textContent =
      "CAMERA READY";


    document.getElementById(
      "lastType"
    ).textContent =
      "SCAN COLUMN QR";


    /*
     * Begin continuous QR scanning.
     */

    requestAnimationFrame(
      scanFrame
    );


  } catch (error) {


    console.error(
      "CAMERA ERROR:",
      error
    );


    button.disabled =
      false;


    button.textContent =
      "TRY AGAIN";


    message.innerHTML =

      '<span class="errorColor">' +

      "<b>CAMERA ERROR — V2.1</b>" +

      "<br><br>" +

      "Error name:<br>" +

      error.name +

      "<br><br>" +

      "Error message:<br>" +

      error.message +

      "</span>";

  }

}


/* =====================================================
   START BUTTON
===================================================== */

document
  .getElementById(
    "startButton"
  )
  .addEventListener(
    "click",
    startCamera
  );


/* =====================================================
   PAGE LOADED
===================================================== */

console.log(
  "Stock Scanner " +
  VERSION +
  " loaded."
);

</script>

</body>
</html>
