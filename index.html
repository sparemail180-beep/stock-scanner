<!DOCTYPE html>
<html>
<head>
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Stock Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#app {
  height: 100%;
  display: flex;
  flex-direction: column;
}

#top {
  background: #111;
  text-align: center;
  padding: 8px;
}

#title {
  font-size: 20px;
  font-weight: bold;
}

#column {
  font-size: 25px;
  font-weight: bold;
  margin-top: 4px;
}

#cameraArea {
  position: relative;
  flex: 1;
  min-height: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#scanBox {
  position: absolute;
  width: 65vw;
  height: 65vw;
  max-width: 330px;
  max-height: 330px;
  border: 3px solid #fff;
  border-radius: 12px;
  pointer-events: none;
}

#bottom {
  background: #111;
  text-align: center;
  padding: 8px;
}

#lastScan {
  font-size: 21px;
  font-weight: bold;
}

#lastType {
  font-size: 14px;
  margin-top: 3px;
}

#count {
  font-size: 13px;
  color: #aaa;
  margin-top: 3px;
}

#startScreen {
  position: fixed;
  inset: 0;
  background: #111;
  z-index: 1000;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;
  padding: 25px;
}

#startButton {
  font-size: 22px;
  font-weight: bold;
  padding: 18px 35px;
  border: none;
  border-radius: 12px;
  background: #fff;
  color: #000;
}

#message {
  margin-top: 20px;
  color: #bbb;
  line-height: 1.5;
}

.columnColor {
  color: #ffd43b;
}

.itemColor {
  color: #55ff77;
}

.errorColor {
  color: #ff5555;
}
</style>
</head>

<body>

<div id="app">

  <div id="top">

    <div id="title">
      STOCK SCANNER
    </div>

    <div id="column">
      COLUMN: NOT SET
    </div>

  </div>

  <div id="cameraArea">

    <video id="video"
           autoplay
           playsinline
           muted></video>

    <div id="scanBox"></div>

    <canvas id="canvas"
            style="display:none;"></canvas>

  </div>

  <div id="bottom">

    <div id="lastScan">
      READY
    </div>

    <div id="lastType">
      Scan Column QR
    </div>

    <div id="count">
      Scans: 0
    </div>

  </div>

</div>


<div id="startScreen">

  <button id="startButton">
    START SCANNER
  </button>

  <div id="message">
    Tap once to start the camera.
    <br><br>
    Scanning will then be automatic.
  </div>

</div>


<script>

/* ============================================
   GOOGLE APPS SCRIPT
============================================ */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwSd26j_QkkD0WiEPgDXAFsLuJx6cAWePwZnT_WV9h8525cjibUVHksF5YbP64Dmzd-eA/exec";


/* ============================================
   VARIABLES
============================================ */

let video =
  document.getElementById("video");

let canvas =
  document.getElementById("canvas");

let ctx =
  canvas.getContext("2d", {
    willReadFrequently: true
  });

let stream = null;

let currentColumn = "";

let scanCount = 0;

let lastValue = "";

let lastScanTime = 0;

const DUPLICATE_DELAY = 1200;


/* ============================================
   BEEP
============================================ */

function beep(
  frequency = 900,
  duration = 80
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!window.audioContext) {
      window.audioContext =
        new AudioContext();
    }

    const audio =
      window.audioContext;

    if (audio.state === "suspended") {
      audio.resume();
    }

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.frequency.value =
      frequency;

    oscillator.type = "sine";

    gain.gain.value = 0.15;

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
      audio.currentTime +
      duration / 1000
    );

  } catch (e) {

    console.log(e);

  }

}


/* ============================================
   DISPLAY
============================================ */

function updateColumn() {

  const element =
    document.getElementById("column");

  if (currentColumn) {

    element.textContent =
      "COLUMN: " + currentColumn;

    element.className =
      "columnColor";

  } else {

    element.textContent =
      "COLUMN: NOT SET";

  }

}


function updateCount() {

  document.getElementById("count")
    .textContent =
      "Scans: " + scanCount;

}


/* ============================================
   SEND TO GOOGLE SHEET
============================================ */

function saveScan(
  value,
  type,
  column,
  itemCode
) {

  const params =
    new URLSearchParams();

  params.append(
    "action",
    "scan"
  );

  params.append(
    "value",
    value
  );

  params.append(
    "type",
    type
  );

  params.append(
    "column",
    column || ""
  );

  params.append(
    "itemCode",
    itemCode || ""
  );

  params.append(
    "device",
    navigator.userAgent
  );


  fetch(
    APPS_SCRIPT_URL +
    "?" +
    params.toString(),
    {
      method: "GET",
      mode: "no-cors",
      cache: "no-store"
    }
  )
  .catch(function(error) {

    console.error(
      "Sheet error:",
      error
    );

  });

}


/* ============================================
   PROCESS QR
============================================ */

function processQR(value) {

  value =
    String(value || "").trim();

  if (!value) {
    return;
  }


  /* Prevent repeated reading */
  const now =
    Date.now();

  if (
    value === lastValue &&
    now - lastScanTime <
      DUPLICATE_DELAY
  ) {

    return;

  }

  lastValue =
    value;

  lastScanTime =
    now;


  /* ==========================================
     COLUMN QR

     Example:

     COLUMN:1
     COLUMN:2
     COLUMN:007
  ========================================== */

  const columnMatch =
    value.match(
      /^COLUMN\s*:\s*(\d+)$/i
    );


  if (columnMatch) {

    currentColumn =
      String(
        Number(
          columnMatch[1]
        )
      );

    scanCount++;

    beep(
      650,
      130
    );

    updateColumn();

    document.getElementById(
      "lastScan"
    ).textContent =
      "COLUMN " + currentColumn;

    document.getElementById(
      "lastScan"
    ).className =
      "columnColor";

    document.getElementById(
      "lastType"
    ).textContent =
      "COLUMN CHANGED";

    document.getElementById(
      "lastType"
    ).className =
      "columnColor";

    updateCount();

    saveScan(
      value,
      "COLUMN",
      currentColumn,
      ""
    );

    return;
  }


  /* ==========================================
     ITEM
  ========================================== */

  if (!currentColumn) {

    beep(
      300,
      250
    );

    document.getElementById(
      "lastScan"
    ).textContent =
      "SCAN COLUMN FIRST";

    document.getElementById(
      "lastScan"
    ).className =
      "errorColor";

    document.getElementById(
      "lastType"
    ).textContent =
      "No active column";

    return;
  }


  scanCount++;

  beep(
    1000,
    80
  );

  document.getElementById(
    "lastScan"
  ).textContent =
    value;

  document.getElementById(
    "lastScan"
  ).className =
    "itemColor";

  document.getElementById(
    "lastType"
  ).textContent =
    "ITEM → COLUMN " +
    currentColumn;

  document.getElementById(
    "lastType"
  ).className =
    "itemColor";

  updateCount();


  saveScan(
    value,
    "ITEM",
    currentColumn,
    value
  );

}


/* ============================================
   QR SCAN LOOP
============================================ */

function scanFrame() {

  if (
    !stream ||
    video.readyState !==
      video.HAVE_ENOUGH_DATA
  ) {

    requestAnimationFrame(
      scanFrame
    );

    return;
  }


  /*
   * Use a smaller image for faster
   * processing on Android.
   */

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  if (!width || !height) {

    requestAnimationFrame(
      scanFrame
    );

    return;
  }


  canvas.width =
    width;

  canvas.height =
    height;


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  const imageData =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  const code =
    jsQR(
      imageData.data,
      width,
      height,
      {
        inversionAttempts:
          "attemptBoth"
      }
    );


  if (code) {

    processQR(
      code.data
    );

  }


  requestAnimationFrame(
    scanFrame
  );

}


/* ============================================
   START CAMERA
============================================ */

async function startCamera() {

  const button =
    document.getElementById(
      "startButton"
    );

  const message =
    document.getElementById(
      "message"
    );


  button.disabled =
    true;

  button.textContent =
    "STARTING...";


  try {

    /*
     * THIS IS THE SAME NATIVE CAMERA
     * METHOD THAT WORKED IN OUR TEST.
     */

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    await video.play();


    /*
     * Camera successfully started.
     */

    document.getElementById(
      "startScreen"
    ).style.display =
      "none";


    document.getElementById(
      "lastScan"
    ).textContent =
      "CAMERA READY";


    document.getElementById(
      "lastType"
    ).textContent =
      "SCAN COLUMN QR";


    /*
     * Start continuous QR scanning.
     */

    requestAnimationFrame(
      scanFrame
    );


  } catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    button.disabled =
      false;

    button.textContent =
      "TRY AGAIN";


    message.innerHTML =

      '<span class="errorColor">' +

      "<b>CAMERA ERROR</b>" +

      "<br><br>" +

      "Name: " +
      error.name +

      "<br>" +

      "Message: " +
      error.message +

      "</span>";

  }

}


/* ============================================
   START BUTTON
============================================ */

document
  .getElementById(
    "startButton"
  )
  .addEventListener(
    "click",
    startCamera
  );

</script>

</body>
</html>
