<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Stock Scanner V2.2.2</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5"></script>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* VERSION */

#version {
  position: fixed;
  top: 0;
  right: 0;
  z-index: 9999;
  background: red;
  color: white;
  padding: 7px 10px;
  font-size: 15px;
  font-weight: bold;
  border-radius: 0 0 0 8px;
}

/* TOP */

#top {
  background: #111;
  text-align: center;
  padding: 10px;
}

#title {
  font-size: 20px;
  font-weight: bold;
}

#column {
  margin-top: 5px;
  font-size: 27px;
  font-weight: bold;
}

/* CAMERA */

#cameraArea {
  position: relative;
  flex: 1;
  min-height: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

#scanBox {
  position: absolute;
  width: 82vw;
  height: 35vw;
  max-width: 430px;
  max-height: 220px;
  border: 3px solid white;
  border-radius: 12px;
  pointer-events: none;
}

/* BOTTOM */

#bottom {
  background: #111;
  text-align: center;
  padding: 9px;
}

#lastScan {
  font-size: 22px;
  font-weight: bold;
}

#lastType {
  margin-top: 4px;
  font-size: 15px;
}

#count {
  margin-top: 4px;
  font-size: 13px;
  color: #aaa;
}

.columnColor {
  color: #ffd43b;
}

.itemColor {
  color: #55ff77;
}

.errorColor {
  color: #ff5555;
}

/* START SCREEN */

#startScreen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #111;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
}

#startButton {
  font-size: 22px;
  font-weight: bold;
  padding: 18px 35px;
  border: none;
  border-radius: 12px;
  background: white;
  color: black;
}

#message {
  margin-top: 20px;
  color: #bbb;
  line-height: 1.5;
}

/* DUPLICATE */

#duplicateOverlay {
  position: fixed;
  inset: 0;
  z-index: 5000;
  background: rgba(0,0,0,0.92);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

#duplicateTitle {
  font-size: 40px;
  font-weight: bold;
  color: #ff4444;
  margin-bottom: 15px;
}

#duplicateCode {
  font-size: 30px;
  font-weight: bold;
  word-break: break-all;
  margin-bottom: 30px;
}

#duplicateButtons {
  display: flex;
  gap: 30px;
}

.duplicateButton {
  width: 130px;
  height: 100px;
  border: none;
  border-radius: 18px;
  font-size: 55px;
  font-weight: bold;
}

#rejectButton {
  background: #d62828;
  color: white;
}

#acceptButton {
  background: #198754;
  color: white;
}

#duplicateHint {
  margin-top: 20px;
  color: #ccc;
  font-size: 15px;
}

</style>

</head>

<body>

<div id="version">
  V2.2.2
</div>

<div id="app">

  <div id="top">

    <div id="title">
      STOCK SCANNER
    </div>

    <div id="column">
      COLUMN: NOT SET
    </div>

  </div>

  <div id="cameraArea">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>

    <div id="scanBox"></div>

  </div>

  <div id="bottom">

    <div id="lastScan">
      READY
    </div>

    <div id="lastType">
      SCAN COLUMN QR
    </div>

    <div id="count">
      Scans: 0
    </div>

  </div>

</div>


<!-- START -->

<div id="startScreen">

  <button id="startButton">
    START SCANNER
  </button>

  <div id="message">

    <b>STOCK SCANNER V2.2.2</b>

    <br><br>

    QR = COLUMN

    <br>

    CODE 128 = ITEM

    <br><br>

    Continuous scanning

  </div>

</div>


<!-- DUPLICATE -->

<div id="duplicateOverlay">

  <div id="duplicateTitle">
    DUPLICATE
  </div>

  <div id="duplicateCode">
    -
  </div>

  <div id="duplicateButtons">

    <button
      id="rejectButton"
      class="duplicateButton">
      ✕
    </button>

    <button
      id="acceptButton"
      class="duplicateButton">
      ✓
    </button>

  </div>

  <div id="duplicateHint">

    ✕ Ignore this scan

    <br>

    ✓ Accept as another physical box

  </div>

</div>


<script>

/* ==================================================
   VERSION
================================================== */

const VERSION = "V2.2.2";


/* ==================================================
   GOOGLE APPS SCRIPT
================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwSd26j_QkkD0WiEPgDXAFsLuJx6cAWePwZnT_WV9h8525cjibUVHksF5YbP64Dmzd-eA/exec";


/* ==================================================
   ELEMENTS
================================================== */

const video =
document.getElementById("video");

const lastScan =
document.getElementById("lastScan");

const lastType =
document.getElementById("lastType");

const count =
document.getElementById("count");

const columnDisplay =
document.getElementById("column");

const duplicateOverlay =
document.getElementById("duplicateOverlay");

const duplicateCode =
document.getElementById("duplicateCode");


/* ==================================================
   STATE
================================================== */

let currentColumn = "";

let scanCount = 0;


/*
 * IMPORTANT:
 *
 * We only remember the immediately
 * previous item.
 *
 * We DO NOT keep a list of all
 * scanned items.
 */

let previousItemCode = "";


/*
 * Prevent ZXing from firing the
 * same barcode dozens of times
 * while it remains in view.
 */

let lastDetectedValue = "";

let lastDetectedFormat = "";

let lastDetectedTime = 0;

const DETECTION_COOLDOWN = 1200;


/*
 * Duplicate waiting for decision.
 */

let pendingDuplicate = null;


/* ==================================================
   AUDIO
================================================== */

let audioContext = null;


function initializeAudio() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    if (!audioContext) {

      audioContext =
        new AudioContext();

    }

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }

  } catch (error) {

    console.log(
      "Audio error:",
      error
    );

  }

}


/* ==================================================
   BEEP
================================================== */

function beep(
  frequency,
  duration
) {

  try {

    initializeAudio();

    if (!audioContext) {
      return;
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type =
      "sine";

    oscillator.frequency.value =
      frequency;

    gain.gain.value =
      0.15;

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      duration / 1000
    );

  } catch (error) {

    console.log(error);

  }

}


/* ==================================================
   ITEM BEEP
================================================== */

function itemBeep() {

  beep(
    1000,
    80
  );

}


/* ==================================================
   COLUMN BEEP
================================================== */

function columnBeep() {

  beep(
    650,
    140
  );

}


/* ==================================================
   DUPLICATE ALERT
================================================== */

function duplicateAlert() {

  try {

    initializeAudio();

    if (audioContext) {

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.type =
        "square";

      oscillator.frequency.setValueAtTime(
        500,
        audioContext.currentTime
      );

      oscillator.frequency.setValueAtTime(
        250,
        audioContext.currentTime + 0.18
      );

      gain.gain.value =
        0.18;

      oscillator.connect(gain);

      gain.connect(
        audioContext.destination
      );

      oscillator.start();

      oscillator.stop(
        audioContext.currentTime +
        0.35
      );

    }

  } catch (error) {

    console.log(error);

  }


  /*
   * Say DUPLICATE.
   */

  try {

    if (
      "speechSynthesis"
      in window
    ) {

      window.speechSynthesis.cancel();

      const speech =
        new SpeechSynthesisUtterance(
          "Duplicate"
        );

      speech.rate =
        1.1;

      speech.pitch =
        0.8;

      speech.volume =
        1;

      window.speechSynthesis
        .speak(speech);

    }

  } catch (error) {

    console.log(error);

  }

}


/* ==================================================
   UPDATE COUNT
================================================== */

function updateCount() {

  count.textContent =
    "Scans: " +
    scanCount;

}


/* ==================================================
   UPDATE COLUMN
================================================== */

function updateColumn() {

  if (currentColumn) {

    columnDisplay.textContent =
      "COLUMN: " +
      currentColumn;

    columnDisplay.className =
      "columnColor";

  } else {

    columnDisplay.textContent =
      "COLUMN: NOT SET";

    columnDisplay.className =
      "";

  }

}


/* ==================================================
   SAVE TO GOOGLE SHEETS
================================================== */

function saveScan(
  value,
  type,
  column,
  itemCode
) {

  /*
   * Build request.
   */

  const params =
    new URLSearchParams();

  params.append(
    "action",
    "scan"
  );

  params.append(
    "value",
    value
  );

  params.append(
    "type",
    type
  );

  params.append(
    "column",
    column || ""
  );

  params.append(
    "itemCode",
    itemCode || ""
  );

  params.append(
    "device",
    "StockScanner-V2.2.2"
  );

  /*
   * Add unique timestamp.
   */

  params.append(
    "t",
    Date.now()
  );


  /*
   * Use a normal GET request.
   *
   * no-cors is necessary for the
   * browser to allow the request to
   * the Apps Script endpoint.
   */

  fetch(
    APPS_SCRIPT_URL +
    "?" +
    params.toString(),
    {
      method: "GET",
      mode: "no-cors",
      cache: "no-store"
    }
  )
  .then(function() {

    console.log(
      "Scan sent:",
      value,
      type,
      column
    );

  })
  .catch(function(error) {

    console.error(
      "Google Sheets error:",
      error
    );

  });

}


/* ==================================================
   COLUMN PARSER
================================================== */

function getColumnNumber(
  text
) {

  const value =
    String(
      text || ""
    ).trim();


  /*
   * Examples:
   *
   * COLUMN:3
   * COLUMN 3
   * COLUMN-3
   * COLUMN_3
   * COLUMN : 3
   */

  const match =
    value.match(
      /^COLUMN\s*[:\-_]?\s*(\d+)/i
    );


  if (!match) {

    return null;

  }


  return String(
    Number(
      match[1]
    )
  );

}


/* ==================================================
   PROCESS COLUMN
================================================== */

function processColumn(
  text
) {

  const column =
    getColumnNumber(
      text
    );


  if (!column) {
    return;
  }


  currentColumn =
    column;


  /*
   * NEW COLUMN = RESET
   * CONSECUTIVE DUPLICATE
   */

  previousItemCode =
    "";


  scanCount++;


  columnBeep();


  updateColumn();


  lastScan.textContent =
    "COLUMN " +
    currentColumn;

  lastScan.className =
    "columnColor";


  lastType.textContent =
    "COLUMN CHANGED";

  lastType.className =
    "columnColor";


  updateCount();


  saveScan(
    text,
    "COLUMN",
    currentColumn,
    ""
  );

}


/* ==================================================
   PROCESS NEW ITEM
================================================== */

function processNewItem(
  value
) {

  /*
   * Remember ONLY the last item.
   */

  previousItemCode =
    value;


  scanCount++;


  itemBeep();


  lastScan.textContent =
    value;

  lastScan.className =
    "itemColor";


  lastType.textContent =
    "CODE 128 → COLUMN " +
    currentColumn;

  lastType.className =
    "itemColor";


  updateCount();


  saveScan(
    value,
    "ITEM",
    currentColumn,
    value
  );

}


/* ==================================================
   SHOW DUPLICATE
================================================== */

function showDuplicate(
  value
) {

  pendingDuplicate =
    value;


  duplicateCode.textContent =
    value;


  duplicateOverlay.style.display =
    "flex";


  duplicateAlert();

}


/* ==================================================
   REJECT DUPLICATE
================================================== */

function rejectDuplicate() {

  const value =
    pendingDuplicate;


  pendingDuplicate =
    null;


  duplicateOverlay.style.display =
    "none";


  /*
   * Clear previous item.
   *
   * This is important:
   *
   * If worker rejects the duplicate,
   * scanning the same code again
   * should NOT immediately create
   * another duplicate warning.
   */

  previousItemCode =
    "";


  lastScan.textContent =
    "IGNORED";

  lastScan.className =
    "errorColor";


  lastType.textContent =
    value +
    " NOT RECORDED";

  lastType.className =
    "errorColor";

}


/* ==================================================
   ACCEPT DUPLICATE
================================================== */

function acceptDuplicate() {

  const value =
    pendingDuplicate;


  pendingDuplicate =
    null;


  duplicateOverlay.style.display =
    "none";


  /*
   * Accept this as another physical
   * box of the same item.
   */

  scanCount++;


  itemBeep();


  lastScan.textContent =
    value;

  lastScan.className =
    "itemColor";


  lastType.textContent =
    "DUPLICATE ACCEPTED → COLUMN " +
    currentColumn;

  lastType.className =
    "itemColor";


  updateCount();


  saveScan(
    value,
    "ITEM",
    currentColumn,
    value
  );


  /*
   * Clear duplicate state.
   *
   * This means the worker can
   * intentionally scan the same
   * physical item again later
   * without getting trapped.
   */

  previousItemCode =
    "";

}


/* ==================================================
   HANDLE RESULT
================================================== */

function handleResult(
  result
) {

  if (!result) {
    return;
  }


  const value =
    String(
      result.getText() || ""
    ).trim();


  if (!value) {
    return;
  }


  const format =
    result.getBarcodeFormat();


  const now =
    Date.now();


  /*
   * Ignore repeated camera frames
   * of the same barcode.
   */

  if (
    value ===
      lastDetectedValue &&
    format ===
      lastDetectedFormat &&
    now -
      lastDetectedTime <
      DETECTION_COOLDOWN
  ) {

    return;

  }


  lastDetectedValue =
    value;

  lastDetectedFormat =
    format;

  lastDetectedTime =
    now;


  /* ============================================
     QR CODE
  ============================================ */

  if (
    format ===
    ZXingBrowser.BarcodeFormat.QR_CODE
  ) {

    /*
     * Only QR beginning with
     * COLUMN is meaningful.
     */

    if (
      /^COLUMN/i.test(
        value
      )
    ) {

      processColumn(
        value
      );

    }

    /*
     * All other QR codes ignored.
     */

    return;

  }


  /* ============================================
     CODE 128
  ============================================ */

  if (
    format ===
    ZXingBrowser.BarcodeFormat.CODE_128
  ) {


    /*
     * Worker must scan a column
     * before scanning items.
     */

    if (!currentColumn) {

      beep(
        300,
        250
      );


      lastScan.textContent =
        "SCAN COLUMN FIRST";

      lastScan.className =
        "errorColor";


      lastType.textContent =
        "CODE 128 ITEM";

      lastType.className =
        "errorColor";


      return;

    }


    /*
     * ONLY CONSECUTIVE DUPLICATE.
     */

    if (
      value ===
      previousItemCode
    ) {

      showDuplicate(
        value
      );

      return;

    }


    /*
     * New/different item.
     */

    processNewItem(
      value
    );

  }

}


/* ==================================================
   START SCANNER
================================================== */

async function startScanner() {

  const button =
    document.getElementById(
      "startButton"
    );

  const message =
    document.getElementById(
      "message"
    );


  button.disabled =
    true;

  button.textContent =
    "STARTING V2.2.2...";


  initializeAudio();


  try {

    /*
     * Check ZXing library.
     */

    if (
      typeof ZXingBrowser ===
      "undefined"
    ) {

      throw new Error(
        "ZXingBrowser library did not load."
      );

    }


    /*
     * Start multi-format scanner.
     */

    const reader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    /*
     * Prefer rear camera.
     */

    await reader.decodeFromConstraints(

      {
        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      },

      video,

      function(
        result,
        error
      ) {

        if (result) {

          handleResult(
            result
          );

        }

      }

    );


    /*
     * Hide start screen.
     */

    document.getElementById(
      "startScreen"
    ).style.display =
      "none";


    lastScan.textContent =
      "CAMERA READY";


    lastType.textContent =
      "SCAN COLUMN QR";


  } catch (error) {

    console.error(
      "V2.2.2 ERROR:",
      error
    );


    button.disabled =
      false;


    button.textContent =
      "TRY AGAIN";


    message.innerHTML =

      '<span class="errorColor">' +

      "<b>V2.2.2 CAMERA ERROR</b>" +

      "<br><br>" +

      "Name: " +

      (error.name || "Unknown") +

      "<br><br>" +

      "Message: " +

      (error.message || error) +

      "</span>";

  }

}


/* ==================================================
   BUTTONS
================================================== */

document
.getElementById(
  "startButton"
)
.addEventListener(
  "click",
  startScanner
);


document
.getElementById(
  "rejectButton"
)
.addEventListener(
  "click",
  rejectDuplicate
);


document
.getElementById(
  "acceptButton"
)
.addEventListener(
  "click",
  acceptDuplicate
);


console.log(
  "Stock Scanner " +
  VERSION +
  " loaded."
);

</script>

</body>
</html>
