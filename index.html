<script>

/* ==================================================
   SETTINGS
================================================== */

const VERSION = "V2.3";

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwSd26j_QkkD0WiEPgDXAFsLuJx6cAWePwZnT_WV9h8525cjibUVHksF5YbP64Dmzd-eA/exec";


/*
 * Barcode detection cooldown.
 *
 * Changed from 1200 ms
 * to 800 ms.
 */

const DETECTION_COOLDOWN = 800;


/* ==================================================
   ELEMENTS
================================================== */

const loginScreen =
document.getElementById("loginScreen");

const loginIdInput =
document.getElementById("loginId");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const loginError =
document.getElementById("loginError");

const workerName =
document.getElementById("workerName");

const video =
document.getElementById("video");

const columnDisplay =
document.getElementById("column");

const columnCountDisplay =
document.getElementById("columnCount");

const boxCountDisplay =
document.getElementById("boxCount");

const lastScan =
document.getElementById("lastScan");

const lastType =
document.getElementById("lastType");

const flashButton =
document.getElementById("flashButton");

const logoutButton =
document.getElementById("logoutButton");

const startScreen =
document.getElementById("startScreen");

const startButton =
document.getElementById("startButton");

const cameraMessage =
document.getElementById("cameraMessage");

const duplicateOverlay =
document.getElementById("duplicateOverlay");

const duplicateCode =
document.getElementById("duplicateCode");


/* ==================================================
   STATE
================================================== */

let currentWorker = "";

let currentColumn = "";

let columnCount = 0;

let boxCount = 0;

let previousItemCode = "";

let scanner = null;

let videoTrack = null;

let flashOn = false;

let pendingDuplicate = null;

let lastDetectedValue = "";

let lastDetectedFormat = "";

let lastDetectedTime = 0;


/* ==================================================
   COUNTERS
================================================== */

function updateCounters(){

  columnCountDisplay.textContent =
    columnCount;

  boxCountDisplay.textContent =
    boxCount;

}


/* ==================================================
   AUDIO
================================================== */

let audioContext = null;


function initializeAudio(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext){
      return;
    }

    if(!audioContext){

      audioContext =
        new AudioContext();

    }

    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }catch(e){

    console.log(e);

  }

}


function beep(
  frequency,
  duration
){

  try{

    initializeAudio();

    if(!audioContext){
      return;
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type =
      "sine";

    oscillator.frequency.value =
      frequency;

    gain.gain.value =
      .15;

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      duration / 1000
    );

  }catch(e){

    console.log(e);

  }

}


function itemBeep(){

  beep(1000,80);

}


function columnBeep(){

  beep(650,140);

}


function duplicateAlert(){

  beep(450,120);

  setTimeout(
    function(){
      beep(250,220);
    },
    140
  );


  try{

    if(
      "speechSynthesis"
      in window
    ){

      speechSynthesis.cancel();

      const speech =
        new SpeechSynthesisUtterance(
          "Duplicate"
        );

      speech.rate =
        1.1;

      speech.pitch =
        .8;

      speechSynthesis.speak(
        speech
      );

    }

  }catch(e){

    console.log(e);

  }

}


/* ==================================================
   LOGIN
================================================== */

function login(){

  const id =
    loginIdInput.value.trim();

  const password =
    passwordInput.value;


  loginError.textContent =
    "";


  if(!id || !password){

    loginError.textContent =
      "Enter Worker ID and Password";

    return;

  }


  loginButton.disabled =
    true;

  loginButton.textContent =
    "LOGGING IN...";


  const params =
    new URLSearchParams();


  params.append(
    "action",
    "login"
  );


  params.append(
    "loginId",
    id
  );


  params.append(
    "password",
    password
  );


  fetch(
    APPS_SCRIPT_URL +
    "?" +
    params.toString() +
    "&t=" +
    Date.now()
  )

  .then(
    response =>
      response.json()
  )

  .then(
    data => {

      if(!data.success){

        throw new Error(
          data.error ||
          "Login failed"
        );

      }


      currentWorker =
        data.worker;


      localStorage.setItem(
        "stockScannerWorker",
        currentWorker
      );


      workerName.textContent =
        currentWorker;


      loginScreen.style.display =
        "none";


      loginIdInput.value =
        "";

      passwordInput.value =
        "";


      startScreen.style.display =
        "flex";


      startButton.focus();

    }
  )

  .catch(
    error => {

      console.error(
        "Login error:",
        error
      );


      loginError.textContent =
        error.message ||
        "Login failed";

    }
  )

  .finally(
    function(){

      loginButton.disabled =
        false;

      loginButton.textContent =
        "LOGIN";

    }
  );

}


/* ==================================================
   SAVED WORKER
================================================== */

function checkSavedWorker(){

  const saved =
    localStorage.getItem(
      "stockScannerWorker"
    );


  if(saved){

    currentWorker =
      saved;


    workerName.textContent =
      currentWorker;


    loginScreen.style.display =
      "none";


    startScreen.style.display =
      "flex";

  }else{

    loginScreen.style.display =
      "flex";


    startScreen.style.display =
      "none";

  }

}


/* ==================================================
   LOGOUT
================================================== */

function logout(){

  if(
    scanner &&
    typeof scanner.reset ===
    "function"
  ){

    try{
      scanner.reset();
    }catch(e){}

  }


  if(video.srcObject){

    video.srcObject
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    video.srcObject =
      null;

  }


  scanner =
    null;

  videoTrack =
    null;


  currentWorker =
    "";

  currentColumn =
    "";

  columnCount =
    0;

  boxCount =
    0;

  previousItemCode =
    "";


  flashOn =
    false;


  localStorage.removeItem(
    "stockScannerWorker"
  );


  workerName.textContent =
    "-";


  columnDisplay.textContent =
    "NOT SET";


  updateCounters();


  loginScreen.style.display =
    "flex";


  startScreen.style.display =
    "none";

}


/* ==================================================
   FLASHLIGHT
================================================== */

async function toggleFlash(){

  if(!videoTrack){

    alert(
      "Camera is not ready."
    );

    return;

  }


  try{

    flashOn =
      !flashOn;


    await videoTrack.applyConstraints({

      advanced:[
        {
          torch:
            flashOn
        }
      ]

    });


    flashButton.textContent =
      flashOn
      ? "🔦 ON"
      : "🔦 FLASH";


  }catch(error){

    console.error(
      "Flash error:",
      error
    );


    flashOn =
      false;


    flashButton.textContent =
      "🔦 FLASH";


    alert(
      "This phone/browser does not allow flashlight control from the camera."
    );

  }

}


/* ==================================================
   VIDEO TRACK
================================================== */

function findVideoTrack(){

  try{

    if(
      video.srcObject
    ){

      const tracks =
        video.srcObject
          .getVideoTracks();


      if(
        tracks.length
      ){

        videoTrack =
          tracks[0];

      }

    }

  }catch(e){

    console.log(e);

  }

}


/* ==================================================
   COLUMN
================================================== */

function getColumnNumber(
  text
){

  const value =
    String(
      text || ""
    ).trim();


  const match =
    value.match(
      /^COLUMN\s*[:\-_]?\s*(\d+)/i
    );


  if(!match){
    return null;
  }


  return String(
    Number(
      match[1]
    )
  );

}


function processColumn(
  text
){

  const column =
    getColumnNumber(
      text
    );


  if(!column){
    return;

  }


  /*
   * Same column QR can stay
   * in front of camera.
   *
   * Detection cooldown prevents
   * repeated processing.
   */

  currentColumn =
    column;


  previousItemCode =
    "";


  columnCount++;


  columnBeep();


  columnDisplay.textContent =
    currentColumn;


  columnDisplay.className =
    "columnColor";


  lastScan.textContent =
    "COLUMN " +
    currentColumn;


  lastScan.className =
    "columnColor";


  lastType.textContent =
    "COLUMN";

  lastType.className =
    "columnColor";


  updateCounters();


  saveScan(
    text,
    "COLUMN",
    currentColumn,
    ""
  );

}


/* ==================================================
   SAVE TO SHEET
================================================== */

function saveScan(
  value,
  type,
  column,
  itemCode
){

  const params =
    new URLSearchParams();


  params.append(
    "action",
    "scan"
  );


  params.append(
    "value",
    value
  );


  params.append(
    "type",
    type
  );


  params.append(
    "column",
    column || ""
  );


  params.append(
    "itemCode",
    itemCode || ""
  );


  params.append(
    "worker",
    currentWorker
  );


  params.append(
    "device",
    navigator.userAgent
  );


  params.append(
    "t",
    Date.now()
  );


  fetch(
    APPS_SCRIPT_URL +
    "?" +
    params.toString(),
    {
      method:"GET",
      mode:"no-cors",
      cache:"no-store"
    }
  )

  .catch(
    error =>
      console.error(
        "Sheet error:",
        error
      )
  );

}


/* ==================================================
   NEW ITEM / BOX
================================================== */

function processNewItem(
  value
){

  previousItemCode =
    value;


  /*
   * This is a real recorded box.
   */

  boxCount++;


  itemBeep();


  lastScan.textContent =
    value;


  lastScan.className =
    "itemColor";


  lastType.textContent =
    "BOX • COLUMN " +
    currentColumn;


  lastType.className =
    "itemColor";


  updateCounters();


  saveScan(
    value,
    "ITEM",
    currentColumn,
    value
  );

}


/* ==================================================
   DUPLICATE
================================================== */

function showDuplicate(
  value
){

  pendingDuplicate =
    value;


  duplicateCode.textContent =
    value;


  duplicateOverlay.style.display =
    "flex";


  duplicateAlert();

}


function rejectDuplicate(){

  pendingDuplicate =
    null;


  duplicateOverlay.style.display =
    "none";


  /*
   * Clear consecutive duplicate
   * state so worker can continue.
   */

  previousItemCode =
    "";


  lastScan.textContent =
    "IGNORED";


  lastScan.className =
    "errorColor";


  lastType.textContent =
    "DUPLICATE NOT RECORDED";


  lastType.className =
    "errorColor";

}


function acceptDuplicate(){

  const value =
    pendingDuplicate;


  pendingDuplicate =
    null;


  duplicateOverlay.style.display =
    "none";


  /*
   * Accepted duplicate is another
   * physical box, so count it.
   */

  boxCount++;


  itemBeep();


  lastScan.textContent =
    value;


  lastScan.className =
    "itemColor";


  lastType.textContent =
    "BOX ACCEPTED • COLUMN " +
    currentColumn;


  lastType.className =
    "itemColor";


  updateCounters();


  saveScan(
    value,
    "ITEM",
    currentColumn,
    value
  );


  previousItemCode =
    "";

}


/* ==================================================
   BARCODE RESULT
================================================== */

function handleResult(
  result
){

  if(!result){
    return;
  }


  const value =
    String(
      result.getText() || ""
    ).trim();


  if(!value){
    return;
  }


  const format =
    result.getBarcodeFormat();


  const now =
    Date.now();


  /*
   * 800 ms cooldown.
   */

  if(
    value ===
      lastDetectedValue &&

    format ===
      lastDetectedFormat &&

    now -
      lastDetectedTime <
      DETECTION_COOLDOWN
  ){

    return;

  }


  lastDetectedValue =
    value;


  lastDetectedFormat =
    format;


  lastDetectedTime =
    now;


  /* ==========================
     QR
  ========================== */

  if(
    format ===
    ZXingBrowser.BarcodeFormat.QR_CODE
  ){

    /*
     * Only QR beginning with
     * COLUMN is useful to us.
     */

    if(
      /^COLUMN/i.test(
        value
      )
    ){

      processColumn(
        value
      );

    }


    return;

  }


  /* ==========================
     CODE 128
  ========================== */

  if(
    format ===
    ZXingBrowser.BarcodeFormat.CODE_128
  ){

    if(!currentColumn){

      beep(
        300,
        250
      );


      lastScan.textContent =
        "SCAN COLUMN FIRST";


      lastScan.className =
        "errorColor";


      lastType.textContent =
        "CODE 128";


      lastType.className =
        "errorColor";


      return;

    }


    /*
     * Only consecutive duplicate.
     */

    if(
      value ===
      previousItemCode
    ){

      showDuplicate(
        value
      );

      return;

    }


    processNewItem(
      value
    );

  }

}


/* ==================================================
   CAMERA
================================================== */

async function startCamera(){

  startButton.disabled =
    true;


  startButton.textContent =
    "STARTING...";


  cameraMessage.textContent =
    "";


  initializeAudio();


  try{

    if(
      typeof ZXingBrowser ===
      "undefined"
    ){

      throw new Error(
        "ZXingBrowser did not load."
      );

    }


    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }
          },

          audio:false

        });


    video.srcObject =
      stream;


    await video.play();


    findVideoTrack();


    scanner =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    scanner.decodeFromVideoElement(
      video,
      function(
        result,
        error
      ){

        if(result){

          handleResult(
            result
          );

        }

      }
    );


    startScreen.style.display =
      "none";


    lastScan.textContent =
      "READY";


    lastScan.className =
      "";


    lastType.textContent =
      "SCAN COLUMN QR";


    lastType.className =
      "";


    /*
     * Always show flash.
     */

    flashButton.style.display =
      "block";


    flashButton.textContent =
      "🔦 FLASH";


    flashOn =
      false;


  }catch(error){

    console.error(
      "V2.3 CAMERA ERROR:",
      error
    );


    startButton.disabled =
      false;


    startButton.textContent =
      "START CAMERA";


    cameraMessage.innerHTML =
      '<span class="errorColor">' +
      "<b>CAMERA ERROR</b><br><br>" +
      (error.name || "Unknown") +
      "<br>" +
      (error.message || "") +
      "</span>";

  }

}
