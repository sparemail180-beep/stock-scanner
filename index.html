
<!DOCTYPE html>
<html>

<head>

content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Stock Scanner V2.6</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;

  font-family:

/* ==================================================

================================================== */

#version{
  position:fixed;

  z-index:99999;

  padding:5px 9px;

  background:#111827;
  color:#fff;

  font-size:11px;
  font-weight:bold;

  border-radius:
    0 0 0 8px;
}


/* ==================================================
   LOGIN
================================================== */

#loginScreen{
  position:fixed;
  inset:0;

  z-index:10000;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

}

#loginBox{

}

#loginVersion{

.loginInput{

.loginInput:focus{

#loginButton{

}


/* ==================================================
   APP
================================================== */

#app{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;
}


/* ==================================================
   HEADER
================================================== */

#header{
  flex-shrink:0;

  padding:
    13px 12px 10px;

  background:#111827;
  color:#fff;
}

#headerTop{
  display:flex;

  align-items:center;
  justify-content:space-between;
}

#title{
  font-size:18px;
  font-weight:800;
}

#worker{
  margin-top:3px;

}

}


/* ==================================================
   CONTROLS
================================================== */

#controls{
  display:flex;

}

  border:0;

  padding:

}


/* ==================================================

================================================== */

#stats{

}

.statCard{

================================================== */

================================================== */

#scanListPanel{

    1px solid #dfe4e9;

}

#scanListHeader{
  flex-shrink:0;

  padding:
    6px 12px;

  display:flex;

  justify-content:space-between;
  align-items:center;

}

#scanListTitle{
  font-size:11px;
  font-weight:800;

  color:#374151;

}

#scanListColumn{

}

#scanList{

  overflow-y:auto;

}

.scanRow{

/* ==================================================

#startScreen{

  justify-content:center;

#startBox{

#startTitle{

#startButton{

/* ==================================================

================================================== */

}

}

}

#duplicateButtons{

}

.duplicateButton{

  border:0;

<script>


/* ==================================================
   VERSION / SETTINGS
================================================== */

const VERSION =
  "V2.6";


const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwSd26j_QkkD0WiEPgDXAFsLuJx6cAWePwZnT_WV9h8525cjibUVHksF5YbP64Dmzd-eA/exec";


/*
 * 800 ms cooldown.
 */

const DETECTION_COOLDOWN =
  800;


/* ==================================================
   ELEMENTS
================================================== */

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const loginIdInput =
  document.getElementById(
    "loginId"
  );

const passwordInput =
  document.getElementById(
    "password"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const workerName =
  document.getElementById(
    "workerName"
  );

const video =
  document.getElementById(
    "video"
  );

const currentColumnNumber =
  document.getElementById(
    "currentColumnNumber"
  );

const columnCountDisplay =
  document.getElementById(
    "columnCount"
  );

const boxCountDisplay =
  document.getElementById(
    "boxCount"
  );

const scanList =
  document.getElementById(
    "scanList"
  );

const scanListColumn =
  document.getElementById(
    "scanListColumn"
  );

const lastScan =
  document.getElementById(
    "lastScan"
  );

const lastType =
  document.getElementById(
    "lastType"
  );

const flashButton =
  document.getElementById(
    "flashButton"
  );

const logoutButton =
  document.getElementById(
    "logoutButton"
  );

const startScreen =
  document.getElementById(
    "startScreen"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const cameraMessage =
  document.getElementById(
    "cameraMessage"
  );

const duplicateOverlay =
  document.getElementById(
    "duplicateOverlay"
  );

const duplicateCode =
  document.getElementById(
    "duplicateCode"
  );


/* ==================================================
   STATE
================================================== */

let currentWorker =
  "";

let currentColumn =
  "";

let columnCount =
  0;

let boxCount =
  0;


/*
 * THIS IS THE IMPORTANT
 * DUPLICATE STATE.
 *
 * We keep the last barcode.
 *
 * Therefore:
 *
 * ABC
 * ABC
 * ABC
 * ABC
 *
 * produces:
 *
 * normal
 * duplicate
 * duplicate
 * duplicate
 */

let previousItemCode =
  "";


let scanner =
  null;

let scannerControls =
  null;

let videoTrack =
  null;

let flashOn =
  false;

let pendingDuplicate =
  null;

let lastDetectedValue =
  "";

let lastDetectedFormat =
  "";

let lastDetectedTime =
  0;


/*
 * Prevents the same camera frame
 * from firing continuously.
 */

let processingDuplicate =
  false;


/* ==================================================
   COUNTERS
================================================== */

function updateCounters(){

  columnCountDisplay.textContent =
    columnCount;

  boxCountDisplay.textContent =
    boxCount;

}


/* ==================================================
   CURRENT COLUMN LIST
================================================== */

function resetColumnList(){

  scanList.innerHTML =
    "";

  const empty =
    document.createElement(
      "div"
    );

  empty.className =
    "emptyList";

  empty.textContent =
    "No boxes scanned yet";

  scanList.appendChild(
    empty
  );

}


function addScanToList(
  value
){

  /*
   * Remove empty message.
   */

  const empty =
    scanList.querySelector(
      ".emptyList"
    );

  if(empty){
    empty.remove();
  }


  const row =
    document.createElement(
      "div"
    );

  row.className =
    "scanRow";


  const index =
    document.createElement(
      "div"
    );

  index.className =
    "scanIndex";

  index.textContent =
    scanList
      .querySelectorAll(
        ".scanRow"
      ).length + 1;


  const code =
    document.createElement(
      "div"
    );

  code.className =
    "scanCode";

  code.textContent =
    value;


  row.appendChild(
    index
  );

  row.appendChild(
    code
  );


  scanList.appendChild(
    row
  );


  /*
   * Always show newest scan.
   */

  scanList.scrollTop =
    scanList.scrollHeight;

}


/* ==================================================
   AUDIO
================================================== */

let audioContext =
  null;


function initializeAudio(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext){
      return;
    }

    if(!audioContext){

      audioContext =
        new AudioContext();

    }

    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }catch(e){

    console.log(e);

  }

}


function beep(
  frequency,
  duration
){

  try{

    initializeAudio();

    if(!audioContext){
      return;
    }

    const oscillator =
      audioContext
        .createOscillator();

    const gain =
      audioContext
        .createGain();


    oscillator.type =
      "sine";

    oscillator.frequency.value =
      frequency;

    gain.gain.value =
      .15;


    oscillator.connect(
      gain
    );

    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      duration / 1000
    );

  }catch(e){

    console.log(e);

  }

}


function itemBeep(){

  beep(
    1000,
    80
  );

}


function columnBeep(){

  beep(
    650,
    140
  );

}


function duplicateAlert(){

  beep(
    450,
    120
  );


  setTimeout(
    function(){

      beep(
        250,
        220
      );

    },
    140
  );


  try{

    if(
      "speechSynthesis"
      in window
    ){

      speechSynthesis.cancel();


      const speech =
        new SpeechSynthesisUtterance(
          "Duplicate"
        );


      speech.rate =
        1.1;

      speech.pitch =
        .8;


      speechSynthesis.speak(
        speech
      );

    }

  }catch(e){

    console.log(e);

  }

}


/* ==================================================
   LOGIN
================================================== */

function login(){

  const id =
    loginIdInput.value
      .trim();

  const password =
    passwordInput.value;


  loginError.textContent =
    "";


  if(
    !id ||
    !password
  ){

    loginError.textContent =
      "Enter Worker ID and Password";

    return;

  }


  loginButton.disabled =
    true;

  loginButton.textContent =
    "LOGGING IN...";


  const params =
    new URLSearchParams();


  params.append(
    "action",
    "login"
  );


  params.append(
    "loginId",
    id
  );


  params.append(
    "password",
    password
  );


  fetch(
    APPS_SCRIPT_URL +
    "?" +
    params.toString() +
    "&t=" +
    Date.now()
  )

  .then(
    response =>
      response.json()
  )

  .then(
    data => {

      if(
        !data.success
      ){

        throw new Error(
          data.error ||
          "Login failed"
        );

      }


      currentWorker =
        data.worker;


      localStorage.setItem(
        "stockScannerWorker",
        currentWorker
      );


      workerName.textContent =
        currentWorker;


      loginScreen.style.display =
        "none";


      loginIdInput.value =
        "";

      passwordInput.value =
        "";


      startScreen.style.display =
        "flex";


      startButton.focus();

    }
  )

  .catch(
    error => {

      console.error(
        "Login error:",
        error
      );


      loginError.textContent =
        error.message ||
        "Login failed";

    }
  )

  .finally(
    function(){

      loginButton.disabled =
        false;

      loginButton.textContent =
        "LOGIN";

    }
  );

}


/* ==================================================
   SAVED LOGIN
================================================== */

function checkSavedWorker(){

  const saved =
    localStorage.getItem(
      "stockScannerWorker"
    );


  if(saved){

    currentWorker =
      saved;


    workerName.textContent =
      currentWorker;


    loginScreen.style.display =
      "none";


    startScreen.style.display =
      "flex";

  }else{

    loginScreen.style.display =
      "flex";


    startScreen.style.display =
      "none";

  }

}


/* ==================================================
   LOGOUT
================================================== */

function logout(){

  try{

    if(
      scannerControls &&
      scannerControls.stop
    ){

      scannerControls.stop();

    }

  }catch(e){}


  try{

    if(
      scanner &&
      scanner.reset
    ){

      scanner.reset();

    }

  }catch(e){}


  if(
    video.srcObject
  ){

    video.srcObject
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    video.srcObject =
      null;

  }


  scanner =
    null;

  scannerControls =
    null;

  videoTrack =
    null;


  currentWorker =
    "";

  currentColumn =
    "";

  columnCount =
    0;

  boxCount =
    0;

  previousItemCode =
    "";

  processingDuplicate =
    false;

  pendingDuplicate =
    null;


  flashOn =
    false;


  localStorage.removeItem(
    "stockScannerWorker"
  );


  workerName.textContent =
    "-";


  currentColumnNumber.textContent =
    "—";


  scanListColumn.textContent =
    "COLUMN —";


  resetColumnList();

  updateCounters();


  loginScreen.style.display =
    "flex";


  startScreen.style.display =
    "none";

}


/* ==================================================
   FLASH
================================================== */

async function toggleFlash(){

  if(!videoTrack){

    alert(
      "Camera is not ready."
    );

    return;

  }


  try{

    flashOn =
      !flashOn;


    await videoTrack
      .applyConstraints({

        advanced:[
          {
            torch:
              flashOn
          }
        ]

      });


    flashButton.textContent =
      flashOn
      ? "🔦 ON"
      : "🔦 FLASH";


  }catch(error){

    console.error(
      "Flash error:",
      error
    );


    flashOn =
      false;


    flashButton.textContent =
      "🔦 FLASH";


    alert(
      "This phone/browser does not allow flashlight control from the camera."
    );

  }

}


/* ==================================================
   VIDEO TRACK
================================================== */

function findVideoTrack(){

  try{

    if(
      video.srcObject
    ){

      const tracks =
        video.srcObject
          .getVideoTracks();


      if(
        tracks.length
      ){

        videoTrack =
          tracks[0];

      }

    }

  }catch(e){

    console.log(e);

  }

}


/* ==================================================
   COLUMN DETECTION
================================================== */

function getColumnNumber(
  text
){

  const value =
    String(
      text || ""
    ).trim();


  const match =
    value.match(
      /^COLUMN\s*[:\-_]?\s*(\d+)/i
    );


  if(!match){
    return null;
  }


  return String(
    Number(
      match[1]
    )
  );

}


/* ==================================================
   PROCESS COLUMN
================================================== */

function processColumn(
  text
){

  const column =
    getColumnNumber(
      text
    );


  if(!column){
    return;
  }


  /*
   * If exactly the same column QR
   * is still in front of camera,
   * don't keep creating columns.
   */

  if(
    column === currentColumn
  ){

    return;

  }


  currentColumn =
    column;


  /*
   * New column means:
   *
   * - reset current-column list
   * - reset consecutive item state
   */

  previousItemCode =
    "";


  columnCount++;


  columnBeep();


  currentColumnNumber.textContent =
    currentColumn;


  scanListColumn.textContent =
    "COLUMN " +
    currentColumn;


  resetColumnList();


  lastScan.textContent =
    "COLUMN " +
    currentColumn;


  lastScan.className =
    "columnColor";


  lastType.textContent =
    "NEW COLUMN";


  lastType.className =
    "columnColor";


  updateCounters();


  saveScan(
    text,
    "COLUMN",
    currentColumn,
    ""
  );

}


/* ==================================================
   SAVE
================================================== */

function saveScan(
  value,
  type,
  column,
  itemCode
){

  const params =
    new URLSearchParams();


  params.append(
    "action",
    "scan"
  );


  params.append(
    "value",
    value
  );


  params.append(
    "type",
    type
  );


  params.append(
    "column",
    column || ""
  );


  params.append(
    "itemCode",
    itemCode || ""
  );


  params.append(
    "worker",
    currentWorker
  );


  params.append(
    "device",
    navigator.userAgent
  );


  params.append(
    "t",
    Date.now()
  );


  fetch(
    APPS_SCRIPT_URL +
    "?" +
    params.toString(),
    {
      method:"GET",
      mode:"no-cors",
      cache:"no-store"
    }
  )
  .catch(
    error =>
      console.error(
        "Sheet error:",
        error
      )
  );

}


/* ==================================================
   RECORD NORMAL BOX
================================================== */

function recordBox(
  value
){

  /*
   * Keep this barcode as the
   * current consecutive barcode.
   */

  previousItemCode =
    value;


  boxCount++;


  itemBeep();


  addScanToList(
    value
  );


  lastScan.textContent =
    value;


  lastScan.className =
    "itemColor";


  lastType.textContent =
    "BOX • COLUMN " +
    currentColumn;


  lastType.className =
    "itemColor";


  updateCounters();


  saveScan(
    value,
    "ITEM",
    currentColumn,
    value
  );

}


/* ==================================================
   DUPLICATE
================================================== */

function showDuplicate(
  value
){

  /*
   * Do not clear previousItemCode.
   *
   * This is important.
   *
   * If 5 boxes have:
   *
   * ABC
   * ABC
   * ABC
   * ABC
   * ABC
   *
   * then every scan after
   * the first is DUPLICATE.
   */

  pendingDuplicate =
    value;


  duplicateCode.textContent =
    value;


  duplicateOverlay.style.display =
    "flex";


  processingDuplicate =
    true;


  duplicateAlert();

}


/* ==================================================
   REJECT DUPLICATE
================================================== */

function rejectDuplicate(){

  const value =
    pendingDuplicate;


  pendingDuplicate =
    null;


  duplicateOverlay.style.display =
    "none";


  processingDuplicate =
    false;


  /*
   * IMPORTANT:
   *
   * Do NOT clear previousItemCode.
   *
   * The next identical box must
   * still be a duplicate.
   */

  lastScan.textContent =
    "IGNORED";


  lastScan.className =
    "errorColor";


  lastType.textContent =
    "DUPLICATE NOT RECORDED";


  lastType.className =
    "errorColor";

}


/* ==================================================
   ACCEPT DUPLICATE
================================================== */

function acceptDuplicate(){

  const value =
    pendingDuplicate;


  pendingDuplicate =
    null;


  duplicateOverlay.style.display =
    "none";


  processingDuplicate =
    false;


  /*
   * IMPORTANT:
   *
   * Keep previousItemCode.
   *
   * Therefore the next identical
   * physical box will ALSO show
   * DUPLICATE.
   */


  boxCount++;


  itemBeep();


  addScanToList(
    value
  );


  lastScan.textContent =
    value;


  lastScan.className =
    "itemColor";


  lastType.textContent =
    "BOX ACCEPTED • COLUMN " +
    currentColumn;


  lastType.className =
    "itemColor";


  updateCounters();


  saveScan(
    value,
    "ITEM",
    currentColumn,
    value
  );

}


/* ==================================================
   FORMAT DETECTION
================================================== */

function getFormatName(
  result
){

  try{

    const format =
      result.getBarcodeFormat();


    /*
     * ZXing BarcodeFormat values.
     *
     * QR_CODE = 11
     * CODE_128 = 4
     */

    if(
      format === 11 ||
      String(format)
        .toUpperCase()
        .includes("QR")
    ){

      return "QR";

    }


    if(
      format === 4 ||
      String(format)
        .toUpperCase()
        .includes("CODE_128")
    ){

      return "CODE_128";

    }


    return String(
      format
    );

  }catch(e){

    return "";

  }

}


/* ==================================================
   RESULT
================================================== */

function handleResult(
  result
){

  if(!result){
    return;
  }


  const value =
    String(
      result.getText() || ""
    ).trim();


  if(!value){
    return;
  }


  const formatName =
    getFormatName(
      result
    );


  const now =
    Date.now();


  /*
   * 800 ms camera cooldown.
   */

  if(
    value ===
      lastDetectedValue &&

    formatName ===
      lastDetectedFormat &&

    now -
      lastDetectedTime <
      DETECTION_COOLDOWN
  ){

    return;

  }


  lastDetectedValue =
    value;


  lastDetectedFormat =
    formatName;


  lastDetectedTime =
    now;


  /* =================================================
     COLUMN QR
  ================================================= */

  if(
    formatName === "QR"
  ){

    /*
     * Only QR values beginning
     * with COLUMN are useful.
     */

    if(
      /^COLUMN/i.test(
        value
      )
    ){

      processColumn(
        value
      );

    }


    return;

  }


  /* =================================================
     CODE 128
  ================================================= */

  if(
    formatName === "CODE_128"
  ){

    if(!currentColumn){

      beep(
        300,
        250
      );


      lastScan.textContent =
        "SCAN COLUMN FIRST";


      lastScan.className =
        "errorColor";


      lastType.textContent =
        "CODE 128";


      lastType.className =
        "errorColor";


      return;

    }


    /*
     * CONSECUTIVE DUPLICATE RULE
     *
     * First ABC:
     *     record
     *
     * Next ABC:
     *     duplicate
     *
     * Next ABC:
     *     duplicate
     *
     * Different XYZ:
     *     record
     *
     * Next XYZ:
     *     duplicate
     */

    if(
      value ===
      previousItemCode
    ){

      showDuplicate(
        value
      );

      return;

    }


    /*
     * Different barcode.
     *
     * This becomes the new
     * consecutive barcode.
     */

    recordBox(
      value
    );

  }

}


/* ==================================================
   START CAMERA
================================================== */

async function startCamera(){

  startButton.disabled =
    true;


  startButton.textContent =
    "STARTING...";


  cameraMessage.textContent =
    "";


  initializeAudio();


  try{

    if(
      typeof ZXingBrowser ===
      "undefined"
    ){

      throw new Error(
        "ZXingBrowser did not load."
      );

    }


    /*
     * Ask for the rear camera.
     *
     * Keep the existing 1280x720
     * request so we don't change
     * the performance profile.
     */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video:{

            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          },

          audio:false

        });


    video.srcObject =
      stream;


    await video.play();


    findVideoTrack();


    /*
     * Multi-format scanner.
     *
     * Reads QR + 1D barcodes.
     */

    scanner =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    scannerControls =
      await scanner
        .decodeFromVideoElement(
          video,
          function(
            result,
            error,
            controls
          ){

            if(result){

              handleResult(
                result
              );

            }

          }
        );


    startScreen.style.display =
      "none";


    lastScan.textContent =
      "READY";


    lastScan.className =
      "";


    lastType.textContent =
      "SCAN COLUMN QR";


    lastType.className =
      "";


    flashButton.style.display =
      "block";


    flashButton.textContent =
      "🔦 FLASH";


    flashOn =
      false;


  }catch(error){

    console.error(
      "V2.6 CAMERA ERROR:",
      error
    );


    startButton.disabled =
      false;


    startButton.textContent =
      "START CAMERA";


    cameraMessage.innerHTML =
      '<span class="errorColor">' +
      "<b>CAMERA ERROR</b><br><br>" +
      (error.name || "Unknown") +
      "<br>" +
      (error.message || "") +
      "</span>";

  }

}
