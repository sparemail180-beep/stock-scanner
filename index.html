
<!DOCTYPE html>

html,body{
  margin:0;

  height:100%;

}

#top{
  background:#111;
  text-align:center;
  padding:9px;
  position:relative;
}

#title{

}

#worker{

  position:relative;

  position:absolute;

}

#lastScan{

  font-weight:bold;
  word-break:break-all;
}

#lastType{
  margin-top:3px;
  font-size:14px;
}

#count{
  margin-top:3px;
  font-size:12px;
  color:#aaa;
}

.columnColor{color:#ffd43b}
.itemColor{color:#55ff77}

/* START CAMERA */

#startScreen{
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.93);
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
}

#startButton{
  border:0;
  border-radius:12px;
  padding:18px 35px;
  font-size:21px;
  font-weight:bold;
}

/* DUPLICATE */

#duplicateOverlay{
  position:fixed;
  inset:0;
  z-index:5000;
  background:rgba(0,0,0,.94);
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

#duplicateTitle{
  color:#ff4444;
  font-size:40px;
  font-weight:bold;
  margin-bottom:15px;
}

#duplicateCode{
  font-size:28px;
  font-weight:bold;
  word-break:break-all;
  margin-bottom:30px;
}

#duplicateButtons{
  display:flex;
  gap:28px;
}

.duplicateButton{
  width:130px;
  height:100px;
  border:0;
  border-radius:18px;
  font-size:55px;
  font-weight:bold;
}

#rejectButton{
  background:#d62828;
  color:#fff;
}

#acceptButton{
  background:#198754;
  color:#fff;
}

#duplicateHint{
  margin-top:18px;
  color:#ccc;
  font-size:14px;

</style>

<body>

<div id="version">V2.3</div>

<!-- LOGIN -->

<div id="loginScreen">

  <div id="loginBox">

    <div id="loginTitle">
      STOCK SCANNER
    </div>

    <div id="loginVersion">

    <input

    <div id="controls">

      <button
        id="flashButton"

        🔦 FLASH
      </button>

      <button
        id="logoutButton"
        class="controlButton">

      </button>

      STOCK SCANNER
    </div>

    </div>

      id="video"

    </video>

    </div>

  </div>

<div id="startScreen">

  <div>

    <button id="startButton">
      START CAMERA
    </button>

      id="cameraMessage"
      style="margin-top:18px;color:#aaa;">
    </div>

  </div>

</div>


<!-- DUPLICATE -->

<div id="duplicateOverlay">

  <div id="duplicateTitle">
    DUPLICATE
  </div>

  <div id="duplicateCode">
    -
  </div>

  <div id="duplicateButtons">

    <button
      id="rejectButton"
      class="duplicateButton">
      ✕
    </button>

    <button
      id="acceptButton"
      class="duplicateButton">
      ✓
    </button>

  </div>

  <div id="duplicateHint">

    ✕ Ignore

    <br><br>

    ✓ Record as another physical box

  </div>

</div>


<script>

/* ==================================================
   SETTINGS
================================================== */

const VERSION = "V2.3";

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwSd26j_QkkD0WiEPgDXAFsLuJx6cAWePwZnT_WV9h8525cjibUVHksF5YbP64Dmzd-eA/exec";


/* ==================================================
   ELEMENTS
================================================== */

const loginScreen =
document.getElementById("loginScreen");

const loginIdInput =
document.getElementById("loginId");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const loginError =
document.getElementById("loginError");

const workerName =
document.getElementById("workerName");

const video =
document.getElementById("video");

const columnDisplay =
document.getElementById("column");

const lastScan =
document.getElementById("lastScan");

const lastType =
document.getElementById("lastType");

const count =
document.getElementById("count");

const flashButton =
document.getElementById("flashButton");

const logoutButton =
document.getElementById("logoutButton");

const startScreen =
document.getElementById("startScreen");

const startButton =
document.getElementById("startButton");

const cameraMessage =
document.getElementById("cameraMessage");

const duplicateOverlay =
document.getElementById("duplicateOverlay");

const duplicateCode =
document.getElementById("duplicateCode");


/* ==================================================
   STATE
================================================== */

let currentWorker = "";

let currentColumn = "";

let scanCount = 0;

let previousItemCode = "";

let scanner = null;

let videoTrack = null;

let flashOn = false;

let pendingDuplicate = null;

let lastDetectedValue = "";

let lastDetectedFormat = "";

let lastDetectedTime = 0;

const DETECTION_COOLDOWN = 1200;


/* ==================================================
   AUDIO
================================================== */

let audioContext = null;


function initializeAudio(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext){
      return;
    }

    if(!audioContext){

      audioContext =
        new AudioContext();

    }

    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }catch(e){

    console.log(e);

  }

}


function beep(
  frequency,
  duration
){

  try{

    initializeAudio();

    if(!audioContext){
      return;
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type =
      "sine";

    oscillator.frequency.value =
      frequency;

    gain.gain.value =
      .15;

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      duration / 1000
    );

  }catch(e){

    console.log(e);

  }

}


function itemBeep(){

  beep(1000,80);

}


function columnBeep(){

  beep(650,140);

}


function duplicateAlert(){

  beep(450,120);

  setTimeout(
    function(){
      beep(250,220);
    },
    140
  );


  try{

    if(
      "speechSynthesis"
      in window
    ){

      speechSynthesis.cancel();

      const speech =
        new SpeechSynthesisUtterance(
          "Duplicate"
        );

      speech.rate =
        1.1;

      speech.pitch =
        .8;

      speechSynthesis.speak(
        speech
      );

    }

  }catch(e){

    console.log(e);

  }

}


/* ==================================================
   LOGIN
================================================== */

function login(){

  const id =
    loginIdInput.value.trim();

  const password =
    passwordInput.value;


  loginError.textContent = "";


  if(!id || !password){

    loginError.textContent =
      "Enter Worker ID and Password";

    return;

  }


  loginButton.disabled =
    true;

  loginButton.textContent =
    "LOGGING IN...";


  const params =
    new URLSearchParams();

  params.append(
    "action",
    "login"
  );

  params.append(
    "loginId",
    id
  );

  params.append(
    "password",
    password
  );


  fetch(
    APPS_SCRIPT_URL +
    "?" +
    params.toString() +
    "&t=" +
    Date.now()
  )

  .then(
    response =>
      response.json()
  )

  .then(
    data => {

      if(!data.success){

        throw new Error(
          data.error ||
          "Login failed"
        );

      }


      currentWorker =
        data.worker;


      localStorage.setItem(
        "stockScannerWorker",
        currentWorker
      );


      workerName.textContent =
        currentWorker;


      loginScreen.style.display =
        "none";


      loginIdInput.value =
        "";

      passwordInput.value =
        "";


      startScreen.style.display =
        "flex";


      startButton.focus();

    }
  )

  .catch(
    error => {

      console.error(
        "Login error:",
        error
      );


      loginError.textContent =
        error.message ||
        "Login failed";

    }
  )

  .finally(
    function(){

      loginButton.disabled =
        false;

      loginButton.textContent =
        "LOGIN";

    }
  );

}


/* ==================================================
   CHECK SAVED WORKER
================================================== */

function checkSavedWorker(){

  const saved =
    localStorage.getItem(
      "stockScannerWorker"
    );


  if(saved){

    currentWorker =
      saved;

    workerName.textContent =
      currentWorker;

    loginScreen.style.display =
      "none";

    startScreen.style.display =
      "flex";

  }else{

    loginScreen.style.display =
      "flex";

    startScreen.style.display =
      "none";

  }

}


/* ==================================================
   LOGOUT
================================================== */

function logout(){

  if(
    scanner &&
    typeof scanner.reset ===
    "function"
  ){

    try{
      scanner.reset();
    }catch(e){}
  }


  if(video.srcObject){

    video.srcObject
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    video.srcObject =
      null;

  }


  scanner =
    null;

  videoTrack =
    null;

  currentWorker =
    "";

  currentColumn =
    "";

  previousItemCode =
    "";

  flashOn =
    false;


  localStorage.removeItem(
    "stockScannerWorker"
  );


  workerName.textContent =
    "-";


  columnDisplay.textContent =
    "COLUMN: NOT SET";


  loginScreen.style.display =
    "flex";

  startScreen.style.display =
    "none";

}


/* ==================================================
   FLASHLIGHT
================================================== */

async function toggleFlash(){

  if(!videoTrack){

    alert(
      "Camera is not ready."
    );

    return;

  }


  try{

    const capabilities =
      videoTrack.getCapabilities
        ? videoTrack.getCapabilities()
        : {};


    /*
     * Try torch even if the browser
     * did not advertise torch support.
     */

    flashOn =
      !flashOn;


    await videoTrack.applyConstraints({

      advanced:[
        {
          torch:
            flashOn
        }
      ]

    });


    flashButton.textContent =
      flashOn
      ? "🔦 FLASH ON"
      : "🔦 FLASH";


  }catch(error){

    console.error(
      "Flash error:",
      error
    );


    flashOn =
      false;

    flashButton.textContent =
      "🔦 FLASH";


    alert(
      "This phone/browser does not allow flashlight control from the camera."
    );

  }

}


/* ==================================================
   CAMERA TRACK
================================================== */

function findVideoTrack(){

  try{

    if(
      video.srcObject
    ){

      const tracks =
        video.srcObject
          .getVideoTracks();

      if(
        tracks.length
      ){

        videoTrack =
          tracks[0];

        return;

      }

    }

  }catch(e){

    console.log(e);

  }

}


/* ==================================================
   COUNT
================================================== */

function updateCount(){

  count.textContent =
    "Scans: " +
    scanCount;

}


/* ==================================================
   COLUMN
================================================== */

function getColumnNumber(
  text
){

  const value =
    String(
      text || ""
    ).trim();


  const match =
    value.match(
      /^COLUMN\s*[:\-_]?\s*(\d+)/i
    );


  if(!match){
    return null;
  }


  return String(
    Number(
      match[1]
    )
  );

}


function processColumn(
  text
){

  const column =
    getColumnNumber(
      text
    );


  if(!column){
    return;
  }


  currentColumn =
    column;


  previousItemCode =
    "";


  scanCount++;

  columnBeep();


  columnDisplay.textContent =
    "COLUMN: " +
    currentColumn;

  columnDisplay.className =
    "columnColor";


  lastScan.textContent =
    "COLUMN " +
    currentColumn;

  lastScan.className =
    "columnColor";


  lastType.textContent =
    "COLUMN CHANGED";

  lastType.className =
    "columnColor";


  updateCount();


  saveScan(
    text,
    "COLUMN",
    currentColumn,
    ""
  );

}


/* ==================================================
   SAVE SCAN
================================================== */

function saveScan(
  value,
  type,
  column,
  itemCode
){

  const params =
    new URLSearchParams();

  params.append(
    "action",
    "scan"
  );

  params.append(
    "value",
    value
  );

  params.append(
    "type",
    type
  );

  params.append(
    "column",
    column || ""
  );

  params.append(
    "itemCode",
    itemCode || ""
  );

  params.append(
    "worker",
    currentWorker
  );

  params.append(
    "device",
    navigator.userAgent
  );

  params.append(
    "t",
    Date.now()
  );


  fetch(
    APPS_SCRIPT_URL +
    "?" +
    params.toString(),
    {
      method:"GET",
      mode:"no-cors",
      cache:"no-store"
    }
  )
  .catch(
    error =>
      console.error(
        "Sheet error:",
        error
      )
  );

}


/* ==================================================
   NEW ITEM
================================================== */

function processNewItem(
  value
){

  previousItemCode =
    value;


  scanCount++;

  itemBeep();


  lastScan.textContent =
    value;

  lastScan.className =
    "itemColor";


  lastType.textContent =
    "CODE 128 → COLUMN " +
    currentColumn;

  lastType.className =
    "itemColor";


  updateCount();


  saveScan(
    value,
    "ITEM",
    currentColumn,
    value
  );

}


/* ==================================================
   DUPLICATE
================================================== */

function showDuplicate(
  value
){

  pendingDuplicate =
    value;


  duplicateCode.textContent =
    value;


  duplicateOverlay.style.display =
    "flex";


  duplicateAlert();

}


function rejectDuplicate(){

  pendingDuplicate =
    null;


  duplicateOverlay.style.display =
    "none";


  previousItemCode =
    "";


  lastScan.textContent =
    "IGNORED";

  lastScan.className =
    "errorColor";


  lastType.textContent =
    "DUPLICATE NOT RECORDED";

  lastType.className =
    "errorColor";

}


function acceptDuplicate(){

  const value =
    pendingDuplicate;


  pendingDuplicate =
    null;


  duplicateOverlay.style.display =
    "none";


  scanCount++;

  itemBeep();


  lastScan.textContent =
    value;

  lastScan.className =
    "itemColor";


  lastType.textContent =
    "DUPLICATE ACCEPTED → COLUMN " +
    currentColumn;

  lastType.className =
    "itemColor";


  updateCount();


  saveScan(
    value,
    "ITEM",
    currentColumn,
    value
  );


  previousItemCode =
    "";

}


/* ==================================================
   RESULT
================================================== */

function handleResult(
  result
){

  if(!result){
    return;
  }


  const value =
    String(
      result.getText() || ""
    ).trim();


  if(!value){
    return;
  }


  const format =
    result.getBarcodeFormat();


  const now =
    Date.now();


  if(
    value ===
      lastDetectedValue &&
    format ===
      lastDetectedFormat &&
    now -
      lastDetectedTime <
      DETECTION_COOLDOWN
  ){

    return;

  }


  lastDetectedValue =
    value;

  lastDetectedFormat =
    format;

  lastDetectedTime =
    now;


  /* QR COLUMN */

  if(
    format ===
    ZXingBrowser.BarcodeFormat.QR_CODE
  ){

    if(
      /^COLUMN/i.test(
        value
      )
    ){

      processColumn(
        value
      );

    }


    return;

  }


  /* CODE 128 ITEM */

  if(
    format ===
    ZXingBrowser.BarcodeFormat.CODE_128
  ){

    if(!currentColumn){

      beep(
        300,
        250
      );


      lastScan.textContent =
        "SCAN COLUMN FIRST";

      lastScan.className =
        "errorColor";


      lastType.textContent =
        "CODE 128 ITEM";

      lastType.className =
        "errorColor";


      return;

    }


    if(
      value ===
      previousItemCode
    ){

      showDuplicate(
        value
      );

      return;

    }


    processNewItem(
      value
    );

  }

}


/* ==================================================
   START CAMERA
================================================== */

async function startCamera(){

  startButton.disabled =
    true;

  startButton.textContent =
    "STARTING...";

  cameraMessage.textContent =
    "";


  initializeAudio();


  try{

    if(
      typeof ZXingBrowser ===
      "undefined"
    ){

      throw new Error(
        "ZXingBrowser did not load."
      );

    }


    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }
          },

          audio:false

        });


    video.srcObject =
      stream;


    await video.play();


    findVideoTrack();


    scanner =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    scanner.decodeFromVideoElement(
      video,
      function(
        result,
        error
      ){

        if(result){

          handleResult(
            result
          );

        }

      }
    );


    startScreen.style.display =
      "none";


    lastScan.textContent =
      "CAMERA READY";

    lastScan.className =
      "";

    lastType.textContent =
      "SCAN COLUMN QR";

    lastType.className =
      "";


    /*
     * IMPORTANT:
     * Flash button is ALWAYS visible.
     */

    flashButton.style.display =
      "block";

    flashButton.textContent =
      "🔦 FLASH";

    flashOn =
      false;


  }catch(error){

    console.error(
      "V2.3 CAMERA ERROR:",
      error
    );


    startButton.disabled =
      false;

    startButton.textContent =
      "START CAMERA";


    cameraMessage.innerHTML =
      '<span class="errorColor">' +
      "<b>CAMERA ERROR</b><br><br>" +
      (error.name || "Unknown") +
      "<br>" +
      (error.message || "") +
      "</span>";

  }

}


/* ==================================================
   EVENTS
================================================== */

loginButton.addEventListener(
  "click",
  login
);


passwordInput.addEventListener(
  "keydown",
  function(e){

    if(
      e.key ===
      "Enter"
    ){

      login();

    }

  }
);


loginIdInput.addEventListener(
  "keydown",
  function(e){

    if(
      e.key ===
      "Enter"
    ){

      passwordInput.focus();

    }

  }
);


startButton.addEventListener(
  "click",
  startCamera
);


flashButton.addEventListener(
  "click",
  toggleFlash
);


logoutButton.addEventListener(
  "click",
  logout
);


document
.getElementById("rejectButton")
.addEventListener(
  "click",
  rejectDuplicate
);


document
.getElementById("acceptButton")
