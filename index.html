<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Stock Scanner V2.2</title>

<!-- ZXing browser: multi-format 1D + 2D barcode reader -->
<script src="https://unpkg.com/@zxing/browser@latest"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* ================================
   VERSION
================================ */

#version {
  position: fixed;
  top: 0;
  right: 0;
  z-index: 9999;

  background: red;
  color: white;

  padding: 7px 10px;

  font-size: 14px;
  font-weight: bold;

  border-radius: 0 0 0 8px;
}

/* ================================
   TOP
================================ */

#top {
  background: #111;
  text-align: center;
  padding: 10px;
}

#title {
  font-size: 20px;
  font-weight: bold;
}

#column {
  margin-top: 5px;
  font-size: 27px;
  font-weight: bold;
}

/* ================================
   CAMERA
================================ */

#cameraArea {
  position: relative;

  flex: 1;
  min-height: 0;

  background: #000;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

#video {
  width: 100%;
  height: 100%;

  object-fit: cover;

  background: #000;
}

#scanBox {
  position: absolute;

  width: 72vw;
  height: 35vw;

  max-width: 380px;
  max-height: 220px;

  border: 3px solid white;
  border-radius: 12px;

  pointer-events: none;
}

/* ================================
   BOTTOM
================================ */

#bottom {
  background: #111;

  text-align: center;

  padding: 9px;
}

#lastScan {
  font-size: 22px;
  font-weight: bold;
}

#lastType {
  margin-top: 4px;
  font-size: 15px;
}

#count {
  margin-top: 4px;
  font-size: 13px;
  color: #aaa;
}

/* ================================
   START SCREEN
================================ */

#startScreen {
  position: fixed;
  inset: 0;

  z-index: 1000;

  background: #111;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 25px;
}

#startButton {
  font-size: 22px;
  font-weight: bold;

  padding: 18px 35px;

  border: none;

  border-radius: 12px;

  background: white;

  color: black;
}

#message {
  margin-top: 20px;

  color: #bbb;

  line-height: 1.5;
}

/* ================================
   COLORS
================================ */

.columnColor {
  color: #ffd43b;
}

.itemColor {
  color: #55ff77;
}

.errorColor {
  color: #ff5555;
}


/* ================================
   DUPLICATE OVERLAY
================================ */

#duplicateOverlay {

  position: fixed;

  inset: 0;

  z-index: 5000;

  background: rgba(0,0,0,0.88);

  display: none;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 20px;
}


#duplicateTitle {

  font-size: 38px;

  font-weight: bold;

  color: #ff5555;

  margin-bottom: 15px;

}


#duplicateCode {

  font-size: 28px;

  font-weight: bold;

  word-break: break-all;

  margin-bottom: 30px;

}


#duplicateButtons {

  display: flex;

  gap: 30px;

}


.duplicateButton {

  width: 130px;

  height: 100px;

  border: none;

  border-radius: 18px;

  font-size: 55px;

  font-weight: bold;

}


#rejectButton {

  background: #d62828;

  color: white;

}


#acceptButton {

  background: #198754;

  color: white;

}


#duplicateHint {

  margin-top: 20px;

  color: #ccc;

  font-size: 15px;

}

</style>

</head>


<body>


<!-- VERSION -->

<div id="version">
  V2.2
</div>


<div id="app">


  <!-- TOP -->

  <div id="top">

    <div id="title">
      STOCK SCANNER
    </div>

    <div id="column">
      COLUMN: NOT SET
    </div>

  </div>


  <!-- CAMERA -->

  <div id="cameraArea">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>

    <div id="scanBox"></div>

  </div>


  <!-- BOTTOM -->

  <div id="bottom">

    <div id="lastScan">
      READY
    </div>

    <div id="lastType">
      SCAN COLUMN QR
    </div>

    <div id="count">
      Scans: 0
    </div>

  </div>


</div>


<!-- START -->

<div id="startScreen">

  <button id="startButton">
    START SCANNER
  </button>

  <div id="message">

    <b>STOCK SCANNER V2.2</b>

    <br><br>

    QR = COLUMN

    <br>

    CODE 128 = ITEM

    <br><br>

    Tap once to start.

  </div>

</div>


<!-- DUPLICATE -->

<div id="duplicateOverlay">

  <div id="duplicateTitle">
    DUPLICATE
  </div>

  <div id="duplicateCode">
    -
  </div>

  <div id="duplicateButtons">

    <button
      id="rejectButton"
      class="duplicateButton">
      ✕
    </button>

    <button
      id="acceptButton"
      class="duplicateButton">
      ✓
    </button>

  </div>

  <div id="duplicateHint">

    ✕ Ignore this scan

    <br>

    ✓ Accept as another physical box

  </div>

</div>


<script>


/* =================================================
   VERSION
================================================= */

const VERSION = "V2.2";


/* =================================================
   GOOGLE APPS SCRIPT
================================================= */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwSd26j_QkkD0WiEPgDXAFsLuJx6cAWePwZnT_WV9h8525cjibUVHksF5YbP64Dmzd-eA/exec";


/* =================================================
   ELEMENTS
================================================= */

const video =
  document.getElementById("video");


const lastScan =
  document.getElementById("lastScan");


const lastType =
  document.getElementById("lastType");


const count =
  document.getElementById("count");


const columnDisplay =
  document.getElementById("column");


const duplicateOverlay =
  document.getElementById(
    "duplicateOverlay"
  );


const duplicateCode =
  document.getElementById(
    "duplicateCode"
  );


/* =================================================
   STATE
================================================= */

let currentColumn = "";

let scanCount = 0;


/*
 * Codes already accepted during
 * this scanner session.
 */

const scannedItems =
  new Set();


/*
 * Current duplicate waiting
 * for worker decision.
 */

let pendingDuplicate = null;


/*
 * Prevent ZXing from firing the
 * same result continuously.
 */

let lastDetectedValue = "";

let lastDetectedTime = 0;

const DETECTION_COOLDOWN = 1000;


/* =================================================
   AUDIO
================================================= */

let audioContext = null;


function initializeAudio() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    if (!audioContext) {

      audioContext =
        new AudioContext();

    }

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }

  } catch (error) {

    console.log(
      "Audio initialization error",
      error
    );

  }

}


/* =================================================
   NORMAL BEEP
================================================= */

function normalBeep() {

  try {

    initializeAudio();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type =
      "sine";

    oscillator.frequency.value =
      1000;

    gain.gain.value =
      0.15;

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      0.08
    );

  } catch (error) {

    console.log(error);

  }

}


/* =================================================
   COLUMN BEEP
================================================= */

function columnBeep() {

  try {

    initializeAudio();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type =
      "sine";

    oscillator.frequency.value =
      650;

    gain.gain.value =
      0.15;

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      0.14
    );

  } catch (error) {

    console.log(error);

  }

}


/* =================================================
   DUPLICATE SOUND
================================================= */

function duplicateAlert() {

  try {

    initializeAudio();


    /*
     * Two descending tones.
     */

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type =
      "square";

    oscillator.frequency.setValueAtTime(
      420,
      audioContext.currentTime
    );

    oscillator.frequency.setValueAtTime(
      240,
      audioContext.currentTime +
      0.18
    );


    gain.gain.value =
      0.18;


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      0.32
    );


  } catch (error) {

    console.log(error);

  }


  /*
   * Voice announcement.
   */

  try {

    if (
      "speechSynthesis"
      in window
    ) {

      window.speechSynthesis.cancel();

      const speech =
        new SpeechSynthesisUtterance(
          "Duplicate"
        );

      speech.rate =
        1.1;

      speech.pitch =
        0.8;

      speech.volume =
        1;

      window.speechSynthesis
        .speak(
          speech
        );

    }

  } catch (error) {

    console.log(error);

  }

}


/* =================================================
   UPDATE COLUMN
================================================= */

function updateColumnDisplay() {

  if (currentColumn) {

    columnDisplay.textContent =
      "COLUMN: " +
      currentColumn;

    columnDisplay.className =
      "columnColor";

  } else {

    columnDisplay.textContent =
      "COLUMN: NOT SET";

    columnDisplay.className = "";

  }

}


/* =================================================
   UPDATE COUNT
================================================= */

function updateCount() {

  count.textContent =
    "Scans: " +
    scanCount;

}


/* =================================================
   SEND TO GOOGLE SHEETS
================================================= */

function saveScan(
  value,
  type,
  column,
  itemCode
) {


  const params =
    new URLSearchParams();


  params.append(
    "action",
    "scan"
  );


  params.append(
    "value",
    value
  );


  params.append(
    "type",
    type
  );


  params.append(
    "column",
    column || ""
  );


  params.append(
    "itemCode",
    itemCode || ""
  );


  params.append(
    "device",
    navigator.userAgent
  );


  fetch(
    APPS_SCRIPT_URL +
    "?" +
    params.toString(),
    {
      method: "GET",
      mode: "no-cors",
      cache: "no-store"
    }
  )
  .catch(
    function(error) {

      console.error(
        "Sheet save error:",
        error
      );

    }
  );

}


/* =================================================
   DETECT COLUMN
================================================= */

function isColumnText(
  text
) {

  /*
   * Accept:

   COLUMN:1
   COLUMN 1
   COLUMN-1
   COLUMN_1
   COLUMN    :    1
  */

  return /^COLUMN\s*[:\-_]?\s*\d+/i
    .test(
      String(text || "").trim()
    );

}


/* =================================================
   GET COLUMN NUMBER
================================================= */

function getColumnNumber(
  text
) {

  const match =
    String(text || "")
      .trim()
      .match(
        /^COLUMN\s*[:\-_]?\s*(\d+)/i
      );


  if (!match) {

    return "";

  }


  return String(
    Number(
      match[1]
    )
  );

}


/* =================================================
   SHOW COLUMN
================================================= */

function processColumn(
  text
) {


  const number =
    getColumnNumber(
      text
    );


  if (!number) {

    return;

  }


  currentColumn =
    number;


  scanCount++;


  columnBeep();


  updateColumnDisplay();


  lastScan.textContent =
    "COLUMN " +
    currentColumn;


  lastScan.className =
    "columnColor";


  lastType.textContent =
    "COLUMN CHANGED";


  lastType.className =
    "columnColor";


  updateCount();


  saveScan(
    text,
    "COLUMN",
    currentColumn,
    ""
  );

}


/* =================================================
   SHOW ITEM
================================================= */

function processNewItem(
  value
) {


  scannedItems.add(
    value
  );


  scanCount++;


  normalBeep();


  lastScan.textContent =
    value;


  lastScan.className =
    "itemColor";


  lastType.textContent =
    "CODE 128 → COLUMN " +
    currentColumn;


  lastType.className =
    "itemColor";


  updateCount();


  saveScan(
    value,
    "ITEM",
    currentColumn,
    value
  );

}


/* =================================================
   DUPLICATE
================================================= */

function showDuplicate(
  value
) {


  pendingDuplicate =
    value;


  duplicateCode.textContent =
    value;


  duplicateOverlay.style.display =
    "flex";


  duplicateAlert();

}


/* =================================================
   REJECT DUPLICATE
================================================= */

function rejectDuplicate() {


  const value =
    pendingDuplicate;


  pendingDuplicate =
    null;


  duplicateOverlay.style.display =
    "none";


  lastScan.textContent =
    "IGNORED";


  lastScan.className =
    "errorColor";


  lastType.textContent =
    value +
    " NOT RECORDED";


  lastType.className =
    "errorColor";


}


/* =================================================
   ACCEPT DUPLICATE
================================================= */

function acceptDuplicate() {


  const value =
    pendingDuplicate;


  pendingDuplicate =
    null;


  duplicateOverlay.style.display =
    "none";


  /*
   * This is another physical box
   * of the same item.
   *
   * We intentionally allow it.
   */

  scanCount++;


  normalBeep();


  lastScan.textContent =
    value;


  lastScan.className =
    "itemColor";


  lastType.textContent =
    "DUPLICATE ACCEPTED → COLUMN " +
    currentColumn;


  lastType.className =
    "itemColor";


  updateCount();


  saveScan(
    value,
    "ITEM",
    currentColumn,
    value
  );

}


/* =================================================
   HANDLE BARCODE RESULT
================================================= */

function handleResult(
  result
) {


  if (!result) {

    return;

  }


  const value =
    String(
      result.getText()
    ).trim();


  if (!value) {

    return;

  }


  const format =
    result
      .getBarcodeFormat();


  /*
   * Prevent rapid repeated
   * callbacks for the same barcode.
   */

  const now =
    Date.now();


  if (
    value ===
      lastDetectedValue &&
    now -
      lastDetectedTime <
      DETECTION_COOLDOWN
  ) {

    return;

  }


  lastDetectedValue =
    value;

  lastDetectedTime =
    now;


  /*
   * ==============================
   * QR CODE
   * ==============================
   */

  if (
    format ===
    ZXing.BarcodeFormat.QR_CODE
  ) {


    /*
     * Only QR codes beginning
     * with COLUMN are meaningful.
     */

    if (
      isColumnText(
        value
      )
    ) {

      processColumn(
        value
      );

    }


    /*
     * All other QR codes
     * are deliberately ignored.
     */

    return;

  }


  /*
   * ==============================
   * CODE 128
   * ==============================
   */

  if (
    format ===
    ZXing.BarcodeFormat.CODE_128
  ) {


    /*
     * A Code 128 item requires
     * an active column.
     */

    if (!currentColumn) {

      lastScan.textContent =
        "SCAN COLUMN FIRST";

      lastScan.className =
        "errorColor";

      lastType.textContent =
        "CODE 128 ITEM";

      lastType.className =
        "errorColor";


      return;

    }


    /*
     * DUPLICATE?
     */

    if (
      scannedItems.has(
        value
      )
    ) {

      showDuplicate(
        value
      );

      return;

    }


    /*
     * NEW ITEM
     */

    processNewItem(
      value
    );

  }

}


/* =================================================
   START ZXING SCANNER
================================================= */

async function startScanner() {


  const button =
    document.getElementById(
      "startButton"
    );


  const message =
    document.getElementById(
      "message"
    );


  button.disabled =
    true;


  button.textContent =
    "STARTING V2.2...";


  initializeAudio();


  try {


    /*
     * Ask browser for camera
     * so we can explicitly choose
     * the rear camera.
     */

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


    /*
     * Put stream into video.
     */

    video.srcObject =
      stream;


    await video.play();


    /*
     * Create multi-format reader.
     */

    const hints =
      new Map();


    /*
     * Only scan the two formats
     * we actually use.
     *
     * This keeps scanning faster.
     */

    hints.set(
      ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [
        ZXing.BarcodeFormat.QR_CODE,
        ZXing.BarcodeFormat.CODE_128
      ]
    );


    hints.set(
      ZXing.DecodeHintType.TRY_HARDER,
      true
    );


    const reader =
      new ZXing.BrowserMultiFormatReader(
        hints
      );


    /*
     * Start continuous scanning.
     */

    reader.decodeFromVideoElement(
      video,
      function(
        result,
        error
      ) {

        if (result) {

          handleResult(
            result
          );

        }

      }
    );


    /*
     * Hide start screen.
     */

    document.getElementById(
      "startScreen"
    ).style.display =
      "none";


    lastScan.textContent =
      "CAMERA READY";


    lastType.textContent =
      "SCAN COLUMN QR";


  } catch (error) {


    console.error(
      "V2.2 CAMERA ERROR",
      error
    );


    button.disabled =
      false;


    button.textContent =
      "TRY AGAIN";


    message.innerHTML =

      '<span class="errorColor">' +

      "<b>V2.2 CAMERA ERROR</b>" +

      "<br><br>" +

      "Name: " +

      error.name +

      "<br><br>" +

      "Message: " +

      error.message +

      "</span>";

  }

}


/* =================================================
   BUTTONS
================================================= */

document
  .getElementById(
    "startButton"
  )
  .addEventListener(
    "click",
    startScanner
  );


document
  .getElementById(
    "rejectButton"
  )
  .addEventListener(
    "click",
    rejectDuplicate
  );


document
  .getElementById(
    "acceptButton"
  )
  .addEventListener(
    "click",
    acceptDuplicate
  );


/* =================================================
   READY
================================================= */

console.log(
  "Stock Scanner " +
  VERSION +
  " loaded."
);

</script>

</body>
</html>
